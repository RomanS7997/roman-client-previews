<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Гарантия покупки — три варианта</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <style>
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f6f6f5;color:#202320;font:15px/1.5 Manrope,Arial,sans-serif}header,main,footer{max-width:1280px;margin:auto;padding:28px 28px}header{border-bottom:1px solid #d8dad6;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:24px;line-height:1.25;margin:0;font-weight:600}header p{margin:0;color:#6a6f68;font-size:13px}.variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.variant{min-width:0}.variant>a{display:block;text-decoration:none;color:inherit}.title{display:flex;align-items:center;gap:12px;margin-bottom:15px}.number{color:#747972;font-size:13px}h2{font-size:17px;font-weight:600;margin:0;flex:1}.swatch{width:20px;height:20px;border-radius:50%;border:1px solid #0002}.mono{background:#171817}.sage{background:#284b38}.rose{background:#6c2f42}.screen{display:block;aspect-ratio:390/844;width:100%;height:auto;object-fit:cover;object-position:top;border:1px solid #d6dad3;border-radius:6px;background:#fff;transition:box-shadow .15s ease}.variant>a:hover .screen{box-shadow:0 5px 18px #172a1514}.open{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c7cdc2;min-height:48px;font-size:13px}.open img{width:20px;height:20px}.variant>a:focus-visible{outline:2px solid #65755f;outline-offset:5px}footer{padding-top:10px;font-size:12px;color:#727770}footer p{margin:0}@media(max-width:760px){header{display:block;padding:24px 20px}header p{margin-top:8px}.variants{grid-template-columns:1fr;gap:35px;max-width:390px;margin:auto}main{padding:25px 22px}h1{font-size:22px}footer{padding:12px 22px 28px}.title{margin-bottom:10px}}@media(prefers-reduced-motion:reduce){.screen{transition:none}}
  </style>
</head>
<body>
  <header><h1>Гарантия на покупку</h1><p>Три варианта · 10 сентября 2026</p></header>
  <main class="variants">
    <article class="variant"><a href="mono.html"><div class="title"><span class="number">01</span><h2>Чёрно-белый</h2><span class="swatch mono" aria-hidden="true"></span></div><img class="screen" src="assets/preview-mono.jpg" width="390" height="844" alt="Чёрно-белый вариант лендинга"><span class="open">Открыть вариант<img src="assets/arrow-right.svg" alt=""></span></a></article>
    <article class="variant"><a href="sage.html"><div class="title"><span class="number">02</span><h2>Шалфей</h2><span class="swatch sage" aria-hidden="true"></span></div><img class="screen" src="assets/preview-sage.jpg" width="390" height="844" alt="Шалфейно-зелёный вариант лендинга"><span class="open">Открыть вариант<img src="assets/arrow-right.svg" alt=""></span></a></article>
    <article class="variant"><a href="rose.html"><div class="title"><span class="number">03</span><h2>Пудра и вино</h2><span class="swatch rose" aria-hidden="true"></span></div><img class="screen" src="assets/preview-rose.jpg" width="390" height="844" alt="Пудровый вариант с винными акцентами"><span class="open">Открыть вариант<img src="assets/arrow-right.svg" alt=""></span></a></article>
  </main>
  <footer><p>Предпросмотр. Основной сайт не изменён.</p></footer>
</body>
</html>
