<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f5fb">
  <title>Гарантия на покупку: два варианта</title>
  <link rel="stylesheet" href="assets/concept-fonts.css">
  <style>
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f7f5fb;color:#151219;font:14px/1.5 Onest,Arial,sans-serif;-webkit-font-smoothing:antialiased}header,main,footer{width:min(100%,960px);margin-inline:auto;padding-inline:20px}header{padding-top:max(34px,calc(env(safe-area-inset-top) + 20px));padding-bottom:25px;border-bottom:1px solid #ddd9e4}h1{max-width:540px;margin:0;font-size:28px;line-height:1.08}header p{margin:9px 0 0;color:#686272}.variants{display:grid;gap:26px;padding-top:26px;padding-bottom:38px}.variant{overflow:hidden;border:1px solid #ddd8e6;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgb(45 25 105/.08)}.variant>a{display:grid;color:inherit;text-decoration:none}.preview{position:relative;height:280px;overflow:hidden;background:#eee}.preview img{display:block;width:100%;height:100%;object-fit:cover}.variant:first-child .preview img{object-position:center 24%}.variant:last-child .preview img{object-position:center 18%}.copy{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:18px;align-items:center;padding:18px}.copy small,.copy strong{display:block}.copy small{color:#5e5675;font-size:11px;font-weight:700;text-transform:uppercase}.copy strong{margin-top:4px;font-size:19px;line-height:1.25}.open{display:grid;width:42px;height:42px;place-items:center;border-radius:50%;background:#2f1a92}.open img{width:19px;height:19px;filter:brightness(0) invert(1)}a:focus-visible{outline:3px solid #ff765f;outline-offset:4px}footer{padding-top:0;padding-bottom:max(28px,env(safe-area-inset-bottom));color:#716b78;font-size:12px}@media(min-width:720px){header{padding-top:54px;padding-bottom:34px}h1{font-size:38px}.variants{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding-top:34px}.preview{height:440px}.copy{padding:21px}.copy strong{font-size:21px}}
  </style>
</head>
<body>
  <header>
    <h1>Два направления лендинга гарантии</h1>
    <p>Одинаковая структура и контент, разная работа с фирменным светом.</p>
  </header>
  <main class="variants">
    <article class="variant">
      <a href="folded.html?v=1">
        <span class="preview"><img src="assets/folded-flow-bg.webp" width="940" height="1672" alt="Градиентный фон Folded Light"></span>
        <span class="copy"><span><small>Вариант 2</small><strong>Folded Light</strong></span><span class="open"><img src="assets/arrow-right.svg" alt=""></span></span>
      </a>
    </article>
    <article class="variant">
      <a href="shield.html?v=1">
        <span class="preview"><img src="assets/shield-flow-bg.webp" width="941" height="1672" alt="Градиентный фон Prism Shield"></span>
        <span class="copy"><span><small>Вариант 3</small><strong>Prism Shield</strong></span><span class="open"><img src="assets/arrow-right.svg" alt=""></span></span>
      </a>
    </article>
  </main>
  <footer>Предпросмотр. Основной сайт и бот не изменены.</footer>
</body>
</html>
