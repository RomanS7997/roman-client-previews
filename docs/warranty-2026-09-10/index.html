<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Гарантия покупки: варианты дизайна</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <style>
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f4f4f2;color:#1c1e1c;font:14px/1.5 Manrope,Arial,sans-serif}header,main,footer{width:min(100%,1120px);margin:auto;padding-inline:20px}header{padding-top:25px;padding-bottom:21px;border-bottom:1px solid #d0d2cf}h1{margin:0;font-size:22px;font-weight:600;line-height:1.2}header p{margin:7px 0 0;color:#696d68;font-size:12px}.variants{display:grid;grid-template-columns:1fr;gap:38px;padding-top:27px;padding-bottom:36px}.variant a{display:block;color:inherit;text-decoration:none}.title{display:flex;align-items:baseline;gap:12px;margin-bottom:11px}.number{color:#777b75;font-size:11px}h2{margin:0;font-size:16px;font-weight:600}.screen{display:block;width:100%;height:auto;aspect-ratio:390/844;object-fit:cover;object-position:top;border:1px solid #d3d5d1;border-radius:4px;background:#fff;transition:box-shadow .16s ease}.variant--featured .screen{border-color:#9f8cfb;box-shadow:0 14px 34px rgb(75 53 244 / .16)}.variant a:hover .screen{box-shadow:0 10px 28px rgb(22 29 24 / .12)}.variant--featured a:hover .screen{box-shadow:0 18px 42px rgb(75 53 244 / .22)}.badge{display:inline-flex;margin-left:auto;padding:4px 9px;border-radius:999px;background:linear-gradient(138deg,#fe7050,#ba5bc7 48%,#4b35f4);color:#fff;font-size:9px;font-weight:700}.open{display:flex;min-height:49px;align-items:center;justify-content:space-between;border-bottom:1px solid #c8cbc6;font-size:12px}.open img{width:19px;height:19px}.variant a:focus-visible{outline:2px solid #525952;outline-offset:5px}footer{padding-top:2px;padding-bottom:30px;color:#747873;font-size:11px}footer p{margin:0}@media(min-width:760px){header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-top:32px;padding-bottom:26px}header p{margin:0}.variants{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:35px 28px 42px}header,footer{padding-inline:28px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){.screen{transition:none}}
  </style>
</head>
<body>
  <header><div><h1>Гарантия на покупку</h1><p>Три самостоятельных направления</p></div><p>Mobile first · полный лендинг</p></header>
  <main class="variants">
    <article class="variant variant--featured"><a href="brand.html?v=2"><div class="title"><span class="number">01</span><h2>Фирменный</h2><span class="badge">Новый</span></div><img class="screen" src="assets/preview-v5-brand.jpg" width="390" height="844" alt="Фирменный мобильный лендинг"><span class="open">Открыть страницу<img src="assets/arrow-right.svg" alt=""></span></a></article>
    <article class="variant"><a href="mono.html?v=3"><div class="title"><span class="number">02</span><h2>Чёрно-белый</h2></div><img class="screen" src="assets/preview-v3-mono.jpg" width="390" height="844" alt="Чёрно-белый мобильный лендинг"><span class="open">Открыть страницу<img src="assets/arrow-right.svg" alt=""></span></a></article>
    <article class="variant"><a href="rose.html?v=3"><div class="title"><span class="number">03</span><h2>Коралловый</h2></div><img class="screen" src="assets/preview-v3-coral.jpg" width="390" height="844" alt="Коралловый мобильный лендинг"><span class="open">Открыть страницу<img src="assets/arrow-right.svg" alt=""></span></a></article>
  </main>
  <footer><p>Предпросмотр. Основной сайт и бот не изменены.</p></footer>
</body>
</html>
