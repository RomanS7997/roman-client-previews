<script type="application/json" id="data">{"sections": [{"title": "Основные экраны", "intro": "Что человек видит по своей воле: вход, анкета, меню, гарантия, покупки, уроки.", "items": [{"n": 1, "key": "6f39c9dee1e2", "anchor": "texts_v2.consent_text", "note": "первый экран после /start", "text": "👋 Добро пожаловать!\n\n🛡 Здесь активируют гарантию 12 месяцев на заводской брак товара, купленного у нас на маркетплейсах, — и дают билет в ежемесячный розыгрыш призов.\n\n📱 Чтобы активировать гарантию, поделитесь номером телефона и примите документы:\n\n📃 Публичная оферта · Политика обработки данных · Согласие на обработку данных · Согласие на рассылку\n\n✅ Нажимая кнопку, вы подтверждаете, что ознакомились с документами.", "state": "changed", "reg": ["E3", "D1"]}, {"n": 2, "key": "ed612ed12a79", "anchor": "texts_v2.ask_gender_text(intro=contact)", "note": "сразу после номера телефона", "text": "📱 Номер записали.\n\nОсталось три вопроса — ответьте, и оформим гарантию и билет. Всё кнопками, 30 секунд.\n\n👨/👩 Выберите ваш пол", "state": "changed", "reg": ["E4"]}, {"n": 3, "key": "2a6078055301", "anchor": "texts_v2.ask_gender_text(intro=profile)", "note": "если анкету бросили и вернулись позже", "text": "🛡 Три вопроса — и оформим гарантию и билет\n\nВсё кнопками, 30 секунд.\n\n👨/👩 Выберите ваш пол", "state": "changed", "reg": ["E4"]}, {"n": 4, "key": "4aa9bd78e819", "anchor": "texts_v2.ask_gender_text(intro=None)", "note": "повторный показ вопроса", "text": "👨/👩 Выберите ваш пол", "state": "changed", "reg": ["E4"]}, {"n": 5, "key": "489d397e40fc", "anchor": "texts_v2.ask_age_text", "note": "", "text": "🎂 А сколько вам лет?", "state": "same", "reg": ["D3"]}, {"n": 6, "key": "9fa610b2ffe5", "anchor": "texts_v2.ask_device_text", "note": "", "text": "📱 Последний вопрос — какой у вас телефон?", "state": "same", "reg": ["D3"]}, {"n": 7, "key": "733ce63b21a8", "anchor": "texts_warranty.warranty_intro_text(after_profile=True)", "note": "сразу после анкеты: «Готово» и первый шаг гарантии одним экраном", "text": "🎉 Готово! Последний шаг — активируем гарантию\n\n⭐ Выберите маркетплейс, на котором покупали товар.", "state": "changed", "reg": ["E5", "D4"]}, {"n": 8, "key": "8de1e1449fbf", "anchor": "texts_v2.main_menu_text(has_purchase=False)", "note": "меню до первой подтверждённой покупки", "text": "📋 Главное меню\n\n🛡 Активировать гарантию — 12 месяцев на заводской брак и билет в розыгрыше.\n🎁 Раздачи — скоро откроются, пришлём уведомление.\n🎬 Как поклеить — короткие видео для телефона и планшета, чтобы обошлось без пузырей.\n🏆 Топ призов — что разыгрываем в этом месяце и кто забирал раньше.\n🤝 Магазины партнёров — наши партнёры на маркетплейсах, чтобы покупать у проверенного продавца.\n💬 Техподдержка — любой вопрос: товар, гарантия, возврат, обмен.", "state": "changed", "reg": ["E14", "C2"]}, {"n": 9, "key": "6b5490477cdc", "anchor": "texts_v2.main_menu_text(has_purchase=True)", "note": "меню после покупки", "text": "📋 Главное меню\n\n🛡 Активировать гарантию — ещё одна покупка: 12 месяцев на заводской брак и ещё один билет.\n📦 Мои покупки — что под гарантией, до какого числа и номера билетов.\n🎁 Раздачи — скоро откроются, пришлём уведомление.\n🎬 Как поклеить — короткие видео для телефона и планшета, чтобы обошлось без пузырей.\n🏆 Топ призов — что разыгрываем в этом месяце и кто забирал раньше.\n🤝 Магазины партнёров — наши партнёры на маркетплейсах, чтобы покупать у проверенного продавца.\n💬 Техподдержка — любой вопрос: товар, гарантия, возврат, обмен.\n\nКаждая активированная гарантия — ещё один билет в розыгрыше.", "state": "changed", "reg": ["E14", "C2"]}, {"n": 10, "key": "72a65dc58625", "anchor": "texts_v2.returning_no_warranty_text", "note": "/start повторно, гарантии ещё нет", "text": "👋 С возвращением!\n\nГарантия и билет всё ещё ваши — нужно только активировать гарантию:\n\n📅 Гарантия 12 месяцев на заводской брак.\n🎫 Билет в ежемесячном розыгрыше.", "state": "same", "reg": ["E14"]}, {"n": 11, "key": "89835a5aca37", "anchor": "texts_v2.returning_active_text", "note": "/start повторно, гарантия есть", "text": "👋 С возвращением! Гарантия активна — держим её весь год.", "state": "same", "reg": ["E14"]}, {"n": 12, "key": "74ac117418b4", "anchor": "texts_v2.partners_text", "note": "кнопка «🤝 Магазины партнёров»", "text": "🤝 Магазины партнёров\n\n✍️ Нужен товар прямо сейчас — напишите в 💬 Техподдержку, пришлём ссылку.\n\n▸ 🔗 Прямые ссылки на наши витрины на Wildberries, Ozon и Яндекс Маркете появятся здесь позже — чтобы покупать у проверенного продавца и не нарваться на подделку.", "state": "same", "reg": []}, {"n": 13, "key": "a103411c8fd3", "anchor": "texts.top_prizes_placeholder_text", "note": "кнопка «🏆 Топ призов», приз месяца не задан", "text": "🏆 Топ призов — новый приз каждый месяц.\n\n🎫 Каждая активированная гарантия — билет в ближайшем розыгрыше.\n📜 Здесь появятся призы месяца и те, кто их забрал.\n\nРаздел наполняем — билеты копятся независимо от этого.", "state": "same", "reg": []}, {"n": 14, "key": "7aabb582d762", "anchor": "texts.top_prizes_list_text", "note": "кнопка «🏆 Топ призов», приз задан", "text": "🏆 Топ призов — новый приз каждый месяц.\n\n▸ 📜 Уже разыграли — нажмите, чтобы раскрыть\n🎁  — \n\n🎫 Каждая активированная гарантия — ещё один билет в розыгрыше.", "state": "same", "reg": []}, {"n": 15, "key": "4e4e928bb873", "anchor": "texts_warranty.warranty_intro_text", "note": "кнопка «🛡 Гарантия», первая покупка: три кнопки маркетплейсов", "text": "🛡 Последний шаг — активируем гарантию\n\n⭐ Выберите маркетплейс, на котором покупали товар.", "state": "changed", "reg": ["D4"]}, {"n": 16, "key": "561335761c74", "anchor": "texts_warranty.warranty_intro_text(repeat=True)", "note": "покупка уже есть — вход повторно", "text": "➕ Активируйте гарантию на ещё один товар\n\n⭐ Оставьте положительный отзыв на маркетплейсе, где покупали его.", "state": "same", "reg": ["D4"]}, {"n": 17, "key": "cbff4f9484c9", "anchor": "texts_warranty.wb_screenshot_text", "note": "выбрали Wildberries", "text": "📷 Пришлите фото экрана с вашим отзывом\n\nНа нём должно быть видно:\n\n📦 наш товар\n⭐ вашу оценку — 5 звёзд\n💬 текст отзыва\n📅 дату отзыва\n\n✅ Отзыв уже есть — просто пришлите его фото экрана.\n\n✍️ Если отзыва ещё нет:\n\n1. Откройте Wildberries → Профиль → Покупки.\n2. Найдите наш товар и нажмите «Оставить отзыв».\n3. Поставьте оценку и напишите пару предложений.\n4. Сделайте фото экрана с отзывом и вернитесь в бота.\n\n🖼 Пример кадра — выше.", "state": "changed", "reg": ["E7", "D5", "D6"]}, {"n": 18, "key": "25c8de6fb794", "anchor": "texts_warranty.ozon_screenshot_text", "note": "выбрали Ozon", "text": "📷 Пришлите фото экрана с вашим отзывом\n\nНа нём должно быть видно:\n\n📦 наш товар\n⭐ вашу оценку — 5 звёзд\n💬 текст отзыва\n📅 дату отзыва\n\n✅ Отзыв уже есть — просто пришлите его фото экрана.\n\n✍️ Если отзыва ещё нет:\n\n1. Откройте Ozon → Заказы.\n2. Найдите наш товар и нажмите «Оставить отзыв».\n3. Поставьте оценку и напишите пару предложений.\n4. Сделайте фото экрана с отзывом и вернитесь в бота.\n\n🖼 Пример кадра — выше.", "state": "changed", "reg": ["E7", "D5", "D6"]}, {"n": 19, "key": "5433d06ecae6", "anchor": "texts_warranty.wb_amount_text", "note": "Wildberries: отзыв принят, просим сумму", "text": "✅ Отзыв приняли — остался последний шаг.\n\n💵 Напишите точную сумму с копейками, которую заплатили за товар — например 512,37.", "state": "same", "reg": ["E8"]}, {"n": 20, "key": "5dcc6db73517", "anchor": "texts_warranty.ozon_order_text", "note": "Ozon: отзыв принят, просим номер заказа", "text": "✅ Отзыв приняли — остался последний шаг.\n\n🔢 Напишите номер заказа с Ozon — он в разделе «Мои заказы» и выглядит так: 0157262141-0136.", "state": "same", "reg": []}, {"n": 21, "key": "91cb5fe8bd93", "anchor": "texts_warranty.ym_order_text", "note": "выбрали Яндекс: сразу номер заказа", "text": "🔢 Напишите номер заказа\n\nНапример 31415926 — он в разделе «Мои заказы», обычно из восьми цифр.\n\n1. Откройте Яндекс Маркет → Заказы.\n2. Откройте заказ с нашим товаром.\n3. Скопируйте номер заказа и пришлите сюда.\n\n📷 Скриншот отзыва здесь не нужен: по номеру найдём всё сами.", "state": "changed", "reg": ["E7"]}, {"n": 22, "key": "dc1441b53e49", "anchor": "texts_warranty.claim_accepted_text", "note": "Wildberries: заявка принята", "text": "✅ Спасибо! Заявка принята — дальше мы сами.\n\n⏳ Маркетплейсу обычно нужно до 3 дней, чтобы опубликовать отзыв.\n🔔 Как только он появится — пришлём сюда уведомление, что гарантия активирована.", "state": "same", "reg": ["D7", "E10"]}, {"n": 23, "key": "0c1e0411a0aa", "anchor": "texts_warranty.ozon_accepted_text", "note": "Ozon: заявка принята", "text": "✅ Спасибо! Заявка принята — дальше мы сами.\n\n⏳ Маркетплейсу обычно нужно до 3 дней, чтобы опубликовать отзыв.\n🔔 Как только он появится — пришлём сюда уведомление, что гарантия активирована.", "state": "same", "reg": ["D7", "E10"]}, {"n": 24, "key": "824259b9bbb2", "anchor": "texts_warranty.ym_manual_text", "note": "Яндекс: заявка ушла специалисту", "text": "✅ Спасибо! Заявка принята — дальше мы сами.\n\n👤 Заявку по Яндексу смотрит специалист.\n🔔 Как проверит — пришлём сюда уведомление, что гарантия активирована.", "state": "same", "reg": ["E10"]}, {"n": 25, "key": "3d3f777f04f2", "anchor": "texts_warranty.claim_screen_text", "note": "кнопка «📋 Статус заявки»", "text": "🎟 Заявка на гарантию\n\n📌 Статус: проверяем\n👉 От вас сейчас: ничего, ждём проверку\n⏳ Следующая проверка: 03.09.2026 20:20\n\n📦 Товар: Защитное стекло для iPhone 15 Pro\n🟣 Маркетплейс: Wildberries\n🧾 Покупка: заказ 0157262141-0136\n📅 Заявка создана: 03.09.2026\n\n▸ 🔍 Последняя проверка: 03.09.2026 14:20", "state": "same", "reg": []}, {"n": 26, "key": "106797238071", "anchor": "texts_warranty.duplicate_text", "note": "эта покупка уже под гарантией", "text": "♻ Эта покупка уже под гарантией.\n\n🧾 Гарантия и выданный по ней билет — в разделе «Мои покупки».\n🎟 Хотите ещё один билет — активируйте гарантию на другую покупку.", "state": "same", "reg": ["D9"]}, {"n": 27, "key": "b1a9ba171cce", "anchor": "bot/handlers/warranty.py:852-858", "note": "ответили «Да, присылайте»", "text": "🔔 Готово, будем присылать.\n🎁 Пришлём карточку, как только появится новый товар с кэшбэком.\nОтключить можно в «Раздачи → Уведомления».\n👌", "state": "changed", "reg": ["E16"]}, {"n": 28, "key": "232f3ecffe65", "anchor": "bot/handlers/warranty.py:858-860", "note": "ответили «Не сейчас»", "text": "👌 Хорошо, не будем присылать.\n🎁 Загляните в раздел «Раздачи» сами, когда станет интересно — там всегда видно, что доступно сейчас.", "state": "same", "reg": ["E16"]}, {"n": 29, "key": "bda2bc49680b", "anchor": "start.purchases_pages (2 покупки)", "note": "раскрывашка на каждую покупку", "text": "📦 Мои покупки — 2\n\n▸ 🛡 Защитное стекло для iPhone 15 Pro\n🏬 Wildberries · куплено 29.07.2026\n📅 Гарантия до 29.07.2027 · осталось 325 дней\n🎟 Билет WB-000128\n\n▸ 🛡 Чехол MagSafe для iPhone 15 Pro\n🏬 Ozon · куплено 29.07.2026\n📅 Гарантия до 29.07.2027 · осталось 325 дней\n🎟 Билет OZ-000131", "state": "changed", "reg": ["E15", "A2"]}, {"n": 30, "key": "72073b03f1f6", "anchor": "bot/handlers/start.py:196-197", "note": "хвост экрана: билеты есть", "text": "🎟 Билетов в розыгрыше за {…}: {…} — итоги придут сюда же.", "state": "changed", "reg": ["E15"]}, {"n": 31, "key": "a2f83d1dfdb4", "anchor": "bot/handlers/start.py:199", "note": "хвост экрана: билетов нет", "text": "🎟 Билетов в этом месяце пока нет — активируйте гарантию.", "state": "same", "reg": ["E15"]}, {"n": 32, "key": "efbd1a00873c", "anchor": "bot/handlers/start.py:203-204", "note": "хвост экрана: подсказка", "text": "💬 Что-то не так с товаром — напишите в техподдержку, разберёмся.\nЧем больше гарантий активируете, тем больше билетов.", "state": "same", "reg": ["E15"]}, {"n": 33, "key": "fa6aa890335a", "anchor": "bot/handlers/start.py:243", "note": "добавка к заголовку, если страниц несколько", "text": "· стр. 1 из 2", "state": "same", "reg": ["E15"]}, {"n": 34, "key": "4e7b6a593801", "anchor": "bot/handlers/start.py:219-221", "note": "покупок ещё нет", "text": "📦 Покупок пока нет.\n🛡 Активируйте гарантию на первую — здесь появятся срок гарантии и билет.", "state": "same", "reg": ["E15"]}, {"n": 35, "key": "c59b6367f546", "anchor": "bot/handlers/howto.py:106-114", "note": "вход в раздел", "text": "🎬 Как поклеить стекло или плёнку\n🫧 Короткие видео: как наклеить ровно, без пузырей и пыли, с первого раза.\n👇 Выберите, что наклеиваете.\n🖼 Стекло с рамкой и без,\n💧 плёнка на телефон,\n🖥 планшет и iPad,\n📷 стекло на камеру.", "state": "same", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 36, "key": "2040d76a68d5", "anchor": "howto.VIDEOS[glass_plain]", "note": "урок", "text": "📱 Стекло на телефон\nКак выставить по краям и выгнать пузыри.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 37, "key": "296e8b0a7a52", "anchor": "howto.VIDEOS[auto_install]", "note": "урок", "text": "⚙️ Стекло на телефон с автоустановкой\nСтекло в рамке-аппликаторе: ставится за один приём, промахнуться почти невозможно.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 38, "key": "86717e4e7ad9", "anchor": "howto.VIDEOS[tablet_glass]", "note": "урок", "text": "🖥 Стекло на iPad\nБольшой экран — удобнее вдвоём или с фиксацией скотчем.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 39, "key": "df0aecf2930c", "anchor": "howto.VIDEOS[tablet_auto]", "note": "урок", "text": "⚙️ Стекло на iPad с автоустановкой\nТот же аппликатор, только под размер планшета.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 40, "key": "fbf4c654ff79", "anchor": "howto.VIDEOS[camera]", "note": "урок", "text": "📷 Стекло на камеру\nМелкие стёкла на блок камер — по одному, с выравниванием.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 41, "key": "9bb0302fcb3b", "anchor": "howto.VIDEOS[phone_film]", "note": "урок", "text": "💧 Плёнка на телефон\nГидрогелевая плёнка: клеится иначе, чем стекло.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 42, "key": "0720581960e5", "anchor": "howto.VIDEOS[tablet_film]", "note": "урок", "text": "💧 Плёнка на iPad\nТа же плёнка, но большая — тянется и не режется по краям.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}, {"n": 43, "key": "492b995f39dc", "anchor": "bot/handlers/howto.py:165-166", "note": "под каждым видео", "text": "🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.", "state": "changed", "reg": ["E17", "E18", "E19", "D16"]}]}, {"title": "Напоминания и уведомления от бота", "intro": "Приходят сами, без действия человека.", "items": [{"n": 44, "key": "f612ab748475", "anchor": "texts_v2.profile_reminder_text", "note": "напоминание через время, если анкету не закончили", "text": "🎁 Роман, гарантия и билет ещё ждут вас.\n\n📝 Осталось 2 ответа — и оформим гарантию и билет.\n🎯 Следующий вопрос — возраст.\n\n▸ 💾 Всё, что вы уже указали, сохранено — заново отвечать не придётся.", "state": "same", "reg": ["B3"]}, {"n": 45, "key": "a5d5d565bdea", "anchor": "texts_v2.profile_last_reminder_text", "note": "последнее напоминание", "text": "🛡 Гарантия всё ещё ждёт вас, Роман.\n\n🔓 Ответьте на оставшиеся вопросы — и в боте откроется:\n\n📅 Гарантия 12 месяцев на заводской брак.\n🎫 Билет в ежемесячном розыгрыше.\n🎬 Видео, как наклеить стекло без пузырей.\n💬 Поддержка, если что-то пойдёт не так.\n\n▸ 💾 Ваши ответы на месте — продолжим с того же вопроса.\n🔕 Больше автоматических напоминаний не будет.", "state": "same", "reg": ["B3"]}, {"n": 46, "key": "5e875b81a08c", "anchor": "bot/handlers/unsubscribe.py:68-69", "note": "после команды /unsubscribe", "text": "✅ Готово! Рекламные сообщения больше приходить не будут.\n\nАктивация гарантии и доставка выигрышей продолжают работать в обычном режиме.", "state": "same", "reg": []}, {"n": 47, "key": "93bfa1b6d940", "anchor": "jobs/warranty.py:232-234", "note": "7 дней без результата — передали специалисту", "text": "⌛ За неделю подтвердить заявку автоматически не получилось.\n\nПередали её специалисту — он посмотрит вручную и напишет вам. Повторять шаги не нужно.", "state": "same", "reg": []}, {"n": 48, "key": "594d120a2b61", "anchor": "texts_warranty.warranty_success_text", "note": "приходит само, когда проверка подтвердила заявку — подпись к картинке билета", "text": "🎉 Готово, Роман — гарантия оформлена.\n\n🛡 Гарантия на «Защитное стекло для iPhone 15 Pro» действует до 03.09.2027.\n\n🎁 И ещё: раз в месяц мы разыгрываем призы среди покупателей. Вы уже участвуете — делать для этого ничего не нужно, результат придёт сюда же.\n\n🎟 Ваш билет: WB-000128\n\n🛒 Чем больше товаров вы покупаете и активируете гарантию, тем больше билетов и выше шанс выиграть.\n\nБилет не сгорает и переходит в следующие розыгрыши.", "state": "changed", "reg": ["E12", "E13", "D8"]}, {"n": 49, "key": "cd0a90e800d4", "anchor": "ticket_image.py — надписи на картинке билета", "note": "картинка приходит вместе с п. «гарантия оформлена»", "text": "• ТВОЙ БИЛЕТ В РОЗЫГРЫШЕ\n• НОМЕР УЧАСТНИКА\n• ПРИЗ МЕСЯЦА\n• Розыгрыш — 1 октября\n• ПРОВЕРКА РОЗЫГРЫША", "state": "changed", "reg": ["E11", "E12"]}, {"n": 50, "key": "b2010035559d", "anchor": "texts_warranty.giveaways_offer_text", "note": "дописывается к успеху, когда раздачи открыты (сейчас закрыты)", "text": "🎁 Хотите возвращать часть денег за покупки?\n\nВремя от времени мы отдаём товары так: вы покупаете — и часть суммы возвращаем сертификатом маркетплейса. Сколько именно, написано в карточке товара.\n\n1. 🔎 Находите товар поиском — прямую ссылку не даём, это условие.\n2. 🛒 Покупаете и присылаете подтверждение.\n3. 💵 Получаете сертификат Wildberries, Ozon или Яндекс Маркета.\n\nМест обычно немного и разбирают их быстро — поэтому и спрашиваем заранее.", "state": "same", "reg": ["A4"]}]}, {"title": "Кастдев (опрос после покупки)", "intro": "Приглашение через неделю после покупки и пять вопросов.", "items": [{"n": 51, "key": "b370be7b6d6d", "anchor": "texts_castdev.invite_text", "note": "первое приглашение", "text": "Вы покупали «Защитное стекло для iPhone 15 Pro». Расскажите, что понравилось, что оказалось неудобным и что стоит улучшить — за это с нас дополнительный билет.\n\n⏱ 5 вопросов, около 2 минут.\n🎤 Отвечайте текстом или голосовым.\n📷 Можно приложить фото или короткое видео.\n🎟 За содержательный ответ после проверки добавим билет в розыгрыше.\n\n🚫 Если опросы совсем не интересны — нажмите «Никогда не участвовать».\n\nКаждый ответ читает живой человек. За особенно полезную идею оператор может начислить сразу 2 дополнительных билета!", "state": "same", "reg": ["B6", "B10"]}, {"n": 52, "key": "79db706fe23e", "anchor": "texts_castdev.last_invite_text", "note": "повторное приглашение", "text": "👋 В прошлый раз было неудобно — напоминаем один раз: короткий опрос о товаре «Защитное стекло для iPhone 15 Pro» всё ещё открыт.\n\n🔕 Это последнее приглашение по этому опросу — больше писать не будем.", "state": "same", "reg": ["B6", "B10"]}, {"n": 53, "key": "1d3854ee629c", "anchor": "texts_castdev.question_text(1)", "note": "вопрос 1 из 5", "text": "🔎 Когда вы выбирали среди похожих товаров, на что вы обращали внимание и что в итоге стало решающим?\n\n✍️ Хватит одного-двух предложений — текстом или 🎤 голосовым.\n📷 Можно приложить фото или короткое видео.\n\nВопрос 1 из 5.", "state": "same", "reg": ["B6", "B10"]}, {"n": 54, "key": "e83494124fb1", "anchor": "texts_castdev.question_text(2)", "note": "вопрос 2 из 5", "text": "📦 Вспомните первое использование этого товара. Что было понятно и просто, а что вызвало сложности?\n\n✍️ Расскажите даже про мелочь — именно из мелочей и получаются правки к товару.\n\nВопрос 2 из 5.", "state": "same", "reg": ["B6", "B10"]}, {"n": 55, "key": "939ae05b64e4", "anchor": "texts_castdev.question_text(3)", "note": "вопрос 3 из 5", "text": "👍 Что в этом товаре оказалось для вас наиболее полезным или удобным? Почему?\n\n🎯 Особенно ценно «почему» — по нему видно, ради чего товар берут.\n\nВопрос 3 из 5.", "state": "same", "reg": ["B6", "B10"]}, {"n": 56, "key": "1f9a55442878", "anchor": "texts_castdev.question_text(4)", "note": "вопрос 4 из 5", "text": "🔧 С какими проблемами или неудобствами вы столкнулись уже в процессе использования этого товара?\n\n📷 Фото или короткое видео скажут больше, чем описание.\n\nВопрос 4 из 5.", "state": "same", "reg": ["B6", "B10"]}, {"n": 57, "key": "470fc6e01516", "anchor": "texts_castdev.question_text(5)", "note": "вопрос 5 из 5", "text": "💡 Последний вопрос: чего вам не хватило в этом товаре во время использования?\n\n🎯 Больше всего помогают конкретные предложения: чего добавить и почему это важно.\n\nВаш ответ читает живой человек. За действительно ценную идею оператор может начислить второй билет.", "state": "same", "reg": ["B6", "B10"]}, {"n": 58, "key": "51d950aeacdf", "anchor": "texts_castdev.answer_saved_text", "note": "ответ записан", "text": "✅ Записали.\n\n💬 Всё понравилось, стекло село ровно.\n📷 Фото: 1\n\n➡️ Можно дополнить ответ или нажать «Продолжить».", "state": "same", "reg": ["B6", "B10"]}, {"n": 59, "key": "bab89820b36c", "anchor": "texts_castdev.too_short_text", "note": "ответ слишком короткий", "text": "✍️ Расскажите чуть подробнее — хватит одного-двух предложений.\n🎤 Можно голосовым: так обычно быстрее, чем набирать.", "state": "same", "reg": ["B6", "B10"]}, {"n": 60, "key": "3966e280b8e0", "anchor": "texts_castdev.nothing_yet_text", "note": "нажали «Продолжить» без ответа", "text": "📭 На этот вопрос ответа пока нет.\n\n🎤 Напишите или наговорите пару предложений — и продолжим.", "state": "same", "reg": ["B6", "B10"]}, {"n": 61, "key": "d9aff2bb2eb6", "anchor": "texts_castdev.postponed_text", "note": "нажали «Не сейчас»", "text": "👍 Хорошо, сейчас не отвлекаем.\n\n🔔 Напомним про этот опрос ещё один раз — через 7 дней вечером.\n🗣 Передумаете раньше — кнопка «Пройти опрос» в приглашении выше работает.", "state": "same", "reg": ["B6", "B10"]}, {"n": 62, "key": "59f58942f448", "anchor": "texts_castdev.opted_out_text", "note": "нажали «Никогда не участвовать»", "text": "🔕 Поняли вас — про опросы больше не пишем.\n\n✍️ Захотите поделиться мнением сами — напишите в 💬 Техподдержку: выслушаем и передадим команде.", "state": "same", "reg": ["B6", "B10"]}, {"n": 63, "key": "5f93f940917c", "anchor": "bot/handlers/castdev.py:182-183", "note": "всплывающее окно после отказа", "text": "Хорошо, больше по этому опросу не пишем. Гарантия, раздачи и розыгрыш работают как обычно.", "state": "same", "reg": ["B6", "B10"]}, {"n": 64, "key": "b226cafa3afa", "anchor": "texts_castdev.submitted_text", "note": "все ответы отправлены", "text": "✅ Готово — ваши ответы ушли на проверку.\n\n🔔 Как проверим, пришлём результат и номер бонусного билета. Делать ничего не нужно.\n📌 Где опрос сейчас — кнопка «Статус опроса» ниже.\n✅ Проходить этот опрос второй раз не нужно.", "state": "same", "reg": ["B6", "B10"]}, {"n": 65, "key": "2a4325953a7a", "anchor": "texts_castdev.survey_status_text", "note": "кнопка «📌 Статус опроса», опрос закрыт", "text": "📭 Опрос закрыт.\n\nПозовём снова, когда появится повод.", "state": "same", "reg": ["B6", "B10"]}, {"n": 66, "key": "b81f64350e63", "anchor": "bot/handlers/castdev.py:143", "note": "нажали старую кнопку приглашения", "text": "Приглашение устарело", "state": "same", "reg": ["B6", "B10"]}, {"n": 67, "key": "b16dbeb18666", "anchor": "bot/handlers/castdev.py:171", "note": "нажали старую кнопку, опрос закрыт", "text": "Приглашение устарело — опрос уже закрыт", "state": "same", "reg": ["B6", "B10"]}, {"n": 68, "key": "cbc7b3b7dbf4", "anchor": "texts_castdev.cancelled_by_giveaway_text", "note": "опрос закрыт из-за участия в раздаче", "text": "🎁 Опрос закрыли: вы заняли место в раздаче.", "state": "same", "reg": ["B6", "B10"]}, {"n": 69, "key": "639299f1aa60", "anchor": "texts_castdev.approved_text", "note": "оператор принял опрос", "text": "🎉 Спасибо! Билеты за обратную связь начислены\n\n🎟 WB-000128\n🎟 WB-000129\n\n🏆 Они уже лежат вместе с остальными вашими билетами и участвуют в ежемесячных розыгрышах.\n\n🧾 Смотреть билеты можно в разделе «Мои покупки».\n\nДва номера — за особенно полезную обратную связь.", "state": "same", "reg": ["B6", "B10"]}, {"n": 70, "key": "b9a851261a95", "anchor": "texts_castdev.rejected_text", "note": "оператор отклонил опрос", "text": "🔍 Опрос проверили — билет за него не начислили.\n\n📄 Причина: на фото экрана не видно текст отзыва.\n✍️ Считаете, что это ошибка — напишите в 💬 Техподдержку, разберёмся.", "state": "same", "reg": ["B6", "B10"]}]}, {"title": "Поддержка", "intro": "Кнопка «💬 Техподдержка», нейросеть сейчас выключена.", "items": [{"n": 71, "key": "5f970d787b1f", "anchor": "support._welcome_text", "note": "вход в поддержку", "text": "💬 Техподдержка\n\nСпрашивайте о чём угодно — по товару, гарантии, доставке или чему-то ещё.\n\n✅ На частые вопросы ответим сразу.\n👤 Если нужно — подключим оператора.\n\n✍️ Напишите вопрос обычным сообщением 👇", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 72, "key": "12b113a8d654", "anchor": "bot/handlers/support.py:399-400", "note": "прислали не текст", "text": "✍️ Напишите вопрос обычным текстом.\nОтветим здесь же.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 73, "key": "4e1162ee3ce6", "anchor": "support_relay.status_card (ждём оператора)", "note": "кнопка «📋 Статус обращения»", "text": "📋 Обращение №7\n\n📌 Статус: 🟡 ждём ответа оператора\n🕘 Открыто: 07.09 07:12\n\n🙏 Спасибо за обращение — оператор ответит вам в ближайшее время.", "state": "changed", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 74, "key": "34acea1acdde", "anchor": "support_relay.status_card (оператор ответил)", "note": "статус после ответа оператора", "text": "📋 Обращение №7\n\n📌 Статус: 🟢 оператор ответил — можно продолжать\n🕘 Открыто: 07.09 07:12\n\n💬 Продолжайте здесь же — всё попадёт в это обращение.", "state": "changed", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 75, "key": "c7673bec14a7", "anchor": "support_relay.status_card (закрыто)", "note": "статус закрытого обращения", "text": "📋 Обращение №7\n\n📌 Статус: ✅ закрыто 07.09 10:12\n🕘 Открыто: 07.09 07:12\n\nПоявится новый вопрос — просто напишите, откроем новое обращение.", "state": "changed", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 76, "key": "112d8fcfd52e", "anchor": "bot/handlers/support.py:222-223", "note": "статус, когда обращения нет", "text": "📋 Открытых обращений нет.\n✍️ Напишите вопрос — и обращение появится.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 77, "key": "28925925b1f9", "anchor": "bot/handlers/support.py:448-449", "note": "сообщение ушло оператору", "text": "📨 Оператор получил ваше сообщение.\nОтвет придёт сюда же, обычно в течение рабочего дня.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 78, "key": "fe1be7fe59f2", "anchor": "bot/handlers/support.py:538-539", "note": "бот сам передал вопрос оператору", "text": "🤝 Передаём вопрос оператору — он напишет в этот же чат.\n💬 Появятся ещё вопросы — пишите сюда же.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 79, "key": "cc7b86d27301", "anchor": "bot/handlers/support.py:604-605", "note": "нажали «Перевести на оператора»", "text": "📨 Передали оператору. Он ответит в этот же чат, обычно в течение рабочего дня.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 80, "key": "13d9d876dc18", "anchor": "bot/handlers/support.py:323-328", "note": "попросили оператора без вопроса", "text": "✅ Передали оператору.\n👤 Ответит в этом же чате.\n🕘 Обычно в течение рабочего дня.\nПоявятся ещё вопросы — пишите сюда же.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 81, "key": "24d3c4ec825b", "anchor": "bot/handlers/support.py:675-677", "note": "прислали файл без слов", "text": "📎 Файл получили.\nОпишите проблему словами — так оператор быстрее поймёт, что случилось.", "state": "changed", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 82, "key": "50db8b97b907", "anchor": "bot/handlers/support.py:675-676", "note": "прислали файл без слов (вариант)", "text": "📎 Файл получили.\nОпишите проблему словами — так оператор быстрее", "state": "changed", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 83, "key": "1cbf0d32b0ae", "anchor": "bot/handlers/support.py:703-705", "note": "прислали фото без слов", "text": "📎 Файл ушёл оператору.\nЕсли можете, добавьте пару слов о проблеме — по одному кадру не всегда понятно, что не так.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 84, "key": "53e34d8624a4", "anchor": "bot/handlers/support.py:765", "note": "заголовок ответа оператора", "text": "📩 Ответ оператора", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 85, "key": "f31db77cad9e", "anchor": "bot/handlers/support.py:769-770", "note": "под ответом оператора", "text": "Чтобы ответить, откройте 💬 Техподдержку — так сообщение точно попадёт оператору.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 86, "key": "7959e183ee94", "anchor": "bot/handlers/support_relay.py:161", "note": "ответ оператора из темы", "text": "📩 Ответ оператора", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 87, "key": "b83b9ca75b00", "anchor": "bot/handlers/support_relay.py:77-79", "note": "оператор закрыл обращение", "text": "✅ Обращение №7 закрыто.\nСпасибо, что написали. Появится новый вопрос — напишите в 💬 Техподдержку, откроем новое обращение.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 88, "key": "7210b2ed00c0", "anchor": "bot/handlers/support_relay.py:126", "note": "оператор открыл обращение заново", "text": "↩️ Обращение открыто заново", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 89, "key": "d866617bbe14", "anchor": "support._limit_reached_text", "note": "лимит сообщений боту на день", "text": "⏳ На сегодня — 20 сообщений.\n\n👤 Дальше отвечает оператор — напишет вам в этот же чат.\n\nЗавтра счётчик обнулится.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 90, "key": "3af130341535", "anchor": "support._banned_support_text", "note": "заблокированный аккаунт в поддержке", "text": "💬 Техподдержка\n\n🔒 Ваш аккаунт заблокирован, поэтому быстрые ответы недоступны.\n\n✍️ Напишите свой вопрос — оператор разберётся вручную.\n\n🕘 Обычно отвечаем в течение рабочего дня.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 91, "key": "608dfb2e8e26", "anchor": "support._too_long_text", "note": "слишком длинное сообщение", "text": "✂ Сообщение длиннее 2000 символов.\n\n✍️ Сократите и пришлите ещё раз, пожалуйста.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 92, "key": "dcab8d2a0082", "anchor": "services/support_agent.py:106", "note": "бот-помощник не понял ответ модели", "text": "Передаём вопрос оператору — он ответит в этом же чате.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 93, "key": "dcab8d2a0082", "anchor": "services/support_agent.py:106", "note": "бот-помощник не справился", "text": "Передаём вопрос оператору — он ответит в этом же чате.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 94, "key": "dcab8d2a0082", "anchor": "services/support_agent.py:106", "note": "бот-помощник не уверен", "text": "Передаём вопрос оператору — он ответит в этом же чате.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 95, "key": "dcab8d2a0082", "anchor": "services/support_agent.py:106", "note": "бот-помощник: проблема со связью", "text": "Передаём вопрос оператору — он ответит в этом же чате.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 96, "key": "dcab8d2a0082", "anchor": "services/support_agent.py:106", "note": "бот-помощник: сбой", "text": "Передаём вопрос оператору — он ответит в этом же чате.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 97, "key": "f5092da5ee5c", "anchor": "bot/handlers/support.py:252", "note": "вышли из поддержки кнопкой меню", "text": "👋 Вышли из режима поддержки. Главное меню ниже.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}, {"n": 98, "key": "f5092da5ee5c", "anchor": "bot/handlers/support.py:252", "note": "вышли из поддержки кнопкой «Выйти»", "text": "👋 Вышли из режима поддержки. Главное меню ниже.", "state": "same", "reg": ["E20", "E21", "D12", "D13"]}]}, {"title": "Розыгрыш: итоги и призы", "intro": "Рассылка итогов, сообщения победителю, сертификат.", "items": [{"n": 99, "key": "4019346dcee8", "anchor": "services/broadcast.py:53-61", "note": "рассылка итогов всем участникам; на месте разрыва «через … любой» стоит ссылка на random.org; строки про участников — варианты", "text": "🎉 Итоги ежемесячного розыгрыша\nМесяц: {…}\nобщий пул\n🏷 {…} — номеров в розыгрыше: {…}", "state": "same", "reg": []}, {"n": 100, "key": "046ad441a988", "anchor": "services/raffle.py:230-232", "note": "победителю", "text": "🎉 Поздравляем, Роман!\n\n\nВы выиграли розыгрыш за сентябрь 2026 — билет №WB-000128 стал счастливым 🎟", "state": "same", "reg": ["D14"]}, {"n": 101, "key": "fb270cb021ea", "anchor": "services/raffle.py:254", "note": "подпись к картинке билета победителя", "text": "🎟 Ваш выигравший билет", "state": "same", "reg": ["D14"]}, {"n": 102, "key": "e7918f2741c5", "anchor": "services/raffle.py:261-262", "note": "победителю: приз ещё не задан", "text": "🏆 Приз подтвердит оператор. Скоро напишем сюда и расскажем, как его получить.", "state": "same", "reg": ["D14"]}, {"n": 103, "key": "3a5aab8083ac", "anchor": "services/raffle.py:266-276", "note": "победителю: приз задан", "text": "🏆 Ваш приз: Сертификат Ozon 5 000 ₽\nНоминал: 5 000 ₽\nМаркетплейс: Ozon\n\nОператор проверит выдачу и свяжется с вами в ближайшее время.", "state": "same", "reg": ["D14"]}, {"n": 104, "key": "66b0ef1aeb1c", "anchor": "bot/handlers/raffle.py:94-98", "note": "победитель выбрал маркетплейс", "text": "✅ Принято — Ozon.\n👤 В ближайшее время с вами свяжется оператор и пришлёт код сертификата.\nКод придёт в этот же чат — ждать письма или звонка не нужно.", "state": "same", "reg": ["D14"]}, {"n": 105, "key": "e6516fd1dd7f", "anchor": "services/raffle.py:413-420", "note": "сертификат Ozon", "text": "🎁 Ваш сертификат готов!\n\n🔑 Код: {…} (нажмите — скопируется)\n\n\nКак активировать:\n1. Откройте приложение Ozon → Профиль → «Подарочные карты и сертификаты».\n2. Нажмите «Активировать» и введите код выше.\n3. Сертификат можно потратить в любом заказе на Ozon.\n\nНе сработало или вопросы — напишите в «💬 Техподдержку».", "state": "same", "reg": ["D14"]}, {"n": 106, "key": "ac5fcb5bddac", "anchor": "services/raffle.py:424-431", "note": "сертификат Wildberries", "text": "🎁 Ваш сертификат готов!\n\n🔑 Код: {…} (нажмите — скопируется)\n\n\nКак активировать:\n1. Откройте приложение Wildberries → Профиль → «Сертификаты и купоны».\n2. Введите код выше — сумма зачислится на ваш WB-кошелёк.\n3. Сертификат спишется при оплате следующего заказа.\n\nНе сработало или вопросы — напишите в «💬 Техподдержку».", "state": "same", "reg": ["D14"]}, {"n": 107, "key": "8fe0f0c30b45", "anchor": "services/raffle.py:435-438", "note": "сертификат другого маркетплейса", "text": "🎁 Ваш сертификат готов!\n\nНоминал: {…} ₽\n\n🔑 Код: {…} (нажмите — скопируется)\n\n\nЕсли появятся вопросы по активации — напишите в «💬 Техподдержку».", "state": "same", "reg": ["D14"]}, {"n": 108, "key": "4e5bdc6ab4a2", "anchor": "services/raffle.py:448-451", "note": "выдача приза подтверждена", "text": "✅ Выдача приза подтверждена!\n\n\nОператор свяжется с вами, если нужно уточнить детали доставки.", "state": "same", "reg": ["D14"]}, {"n": 109, "key": "25709b944c15", "anchor": "services/raffle.py:486-488", "note": "выдачу не подтвердили", "text": "Здравствуйте! Проверка розыгрыша показала, что мы не можем подтвердить выдачу приза по вашему билету. Оператор свяжется с вами в ближайшее время и всё объяснит.", "state": "same", "reg": ["D14"]}, {"n": 110, "key": "8cc1920b6565", "anchor": "ticket_card.py — надписи на картинке выигравшего билета", "note": "", "text": "• СЧАСТЛИВЫЙ БИЛЕТ\n• розыгрыш за сентябрь 2026\n• ПРИЗ\n• ВЫИГРЫШ", "state": "same", "reg": []}, {"n": 111, "key": "f2a22eab2dc1", "anchor": "certificate_pdf.py — надписи в PDF сертификата", "note": "", "text": "• Сертификат победителя · WB-000128\n• Клуб покупателей\n• СЕРТИФИКАТ\n• ПРИЗ\n• ВЫДАН ВЛАДЕЛЬЦУ БИЛЕТА\n• Участник: Роман\n• МАРКЕТПЛЕЙС\n• РОЗЫГРЫШ ЗА\n• ДАТА ВЫДАЧИ\n• КОД СЕРТИФИКАТА\n• ПРОВЕРКА ЧЕСТНОСТИ\n• Отсканируй QR →\n• Источник: random.org\n• Клуб покупателей · розыгрыши на random.org Signed API", "state": "same", "reg": []}]}, {"title": "Раздачи и отчёт (раздел закрыт заглушкой)", "intro": "Тексты живые, показывает только заглушку.", "items": [{"n": 112, "key": "61588f5cab8a", "anchor": "texts_giveaway.giveaways_soon_text", "note": "ЗАГЛУШКА — то, что видят сейчас", "text": "🎁 Раздачи скоро откроются\n\nГотовим раздел: подбираем товары и условия. Когда откроем — пришлём уведомление сюда, следить и заходить не нужно.\n\nСейчас работает:\n\n🛡 Гарантия — 12 месяцев на заводской брак и билет в ежемесячном розыгрыше.\n💬 Техподдержка — если с товаром что-то не так.", "state": "same", "reg": ["D11", "E24"]}, {"n": 113, "key": "a7c8582a5f6c", "anchor": "texts_giveaway.giveaways_intro_text", "note": "вход в раздел", "text": "🎁 Часть суммы за покупку — вернём сертификатом\n\n💵 Выбираете товар, выполняете условия — и часть суммы возвращаем сертификатом того маркетплейса, где купили. Это и есть кэшбэк.\n🔎 Товар ищете сами, поиском на маркетплейсе — по фото и бренду.\n\n🎁 Смотреть товары — суммы сертификатов, свободные места и сроки.\n📊 Мои заявки — что уже начали и что на проверке.\n💵 Мой кэшбэк — выданные сертификаты и коды.\n🔔 Уведомления — приглашения на новые раздачи.\n\n▸ 🔗 Прямую ссылку и номер товара не даём специально: маркетплейс должен видеть обычный живой поиск, а не переход по ссылке. Это и есть главное условие раздачи.", "state": "same", "reg": []}, {"n": 114, "key": "dc297b0866c9", "anchor": "bot/handlers/giveaways.py:542-545", "note": "список товаров", "text": "🎁 Доступные товары\n👇 Нажмите на строку — покажем условия, сумму кэшбэка и свободные места.\nПока не нажмёте «Участвую», ничего", "state": "same", "reg": []}, {"n": 115, "key": "5c9a5aaf34b1", "anchor": "bot/handlers/giveaways.py:509-513", "note": "активных раздач нет", "text": "🎁 Сейчас активных раздач нет.\n\nКогда появятся новые товары, они будут здесь.\n📊 Мои заявки", "state": "same", "reg": []}, {"n": 116, "key": "cd0f051911ad", "anchor": "texts_giveaway.giveaway_card_text", "note": "карточка товара", "text": "🎁 Микрофон игровой для ПК\n\n💵 Вернём примерно 5 000 ₽ сертификатом\n🎉 Это 1% от суммы заказа\n🟣 Покупка: Wildberries\n📦 Свободно мест: 1 из 5\n\n💳 Сертификат придёт от Wildberries — того же маркетплейса, где купили, — а не переводом на карту.\n\n▸ 🔎 Товар ищем поиском по фото и фильтру бренда: прямую ссылку не даём, это часть условий.\n\n▸ 📌 Условия участия — нажмите, чтобы раскрыть\n—\n\n👇 Нажмёте «✅ Участвую» — место закрепим за вами на 1 минуту.", "state": "same", "reg": []}, {"n": 117, "key": "fe5569a16490", "anchor": "bot/handlers/giveaways.py:740-744", "note": "как это работает: Wildberries", "text": "1. Нажмите «Участвую» — зарезервируем место.\n2. Оформите заказ на наш товар на Ozon.\n3. Пришлите номер заказа из «Мои заказы» — проверим автоматически, скрины не нужны.\n4. После получения подтвердите отчётом — и придёт сертификат Ozon.", "state": "same", "reg": []}, {"n": 118, "key": "fe5569a16490", "anchor": "bot/handlers/giveaways.py:740-744", "note": "как это работает: Ozon", "text": "1. Нажмите «Участвую» — зарезервируем место.\n2. Оформите заказ на наш товар на Ozon.\n3. Пришлите номер заказа из «Мои заказы» — проверим автоматически, скрины не нужны.\n4. После получения подтвердите отчётом — и придёт сертификат Ozon.", "state": "same", "reg": []}, {"n": 119, "key": "b611c04698b6", "anchor": "bot/handlers/giveaways.py:731-736", "note": "как это работает: Яндекс", "text": "1. Нажмите «Участвую» — зарезервируем место.\n2. Оформите заказ на наш товар на Яндекс Маркете.\n3. Пришлите номер заказа из «Мои заказы» — проверим автоматически, скрины не нужны.\n4. После получения подтвердите отчётом — и придёт сертификат Яндекс Маркета.", "state": "same", "reg": []}, {"n": 120, "key": "40f8f1514f51", "anchor": "giveaways.py:189-230 — всплывающие окна при «Участвую»", "note": "", "text": "• Слоты уже разобрали. Посмотри другие активные раздачи.\n• Эта раздача сейчас недоступна\n• Извините, этот товар уже разобрали\n• Извините, этот товар уже разобрали. Вот другие активные раздачи:\n• У вас уже есть заявка по этой раздаче\n• Место закреплено", "state": "same", "reg": []}, {"n": 121, "key": "cba28bbcb4a2", "anchor": "texts_giveaway.reserved_text", "note": "место занято", "text": "✅ Место ваше — держим его 1 минуту.\n\n🪜 За это время проходим шаги 1–4: конкуренты, поиск нашего товара, просмотр карточки и общая корзина.\n\n♾ Шаги 5–7 идут уже без таймера — место остаётся за вами.\n\n▸ ⏹ Как примем скрин общей корзины, таймер остановится, место сохранится, а шаг 5 откроется сразу.\n\nТак вы не потеряете место, даже если проверка займёт время.", "state": "same", "reg": []}, {"n": 122, "key": "c4230560369d", "anchor": "texts_giveaway.step1_text", "note": "", "text": "1️⃣ Шаг 1 из 7 · конкуренты\n\n1. 🔎 Введите в поиске Wildberries запрос: «Микрофон , ргб , звук».\n2. 👀 Просмотрите карточки конкурентов из ТОП-10.\n3. 🧺 Положите в корзину 2–3 похожих товара.\n\n📷 Пришлите скрин корзины, где видны выбранные товары конкурентов.\n\nТак маркетплейс видит живой интерес к категории, а не переход по прямой ссылке.", "state": "same", "reg": []}, {"n": 123, "key": "a0357f6126b6", "anchor": "texts_giveaway.step2_text", "note": "", "text": "2️⃣ Шаг 2 из 7 · наш товар\n\n🔎 В фильтре «Бренд» выберите — и найдите наш товар «Защитное стекло для iPhone 15 Pro» по фотографии.\n\n📷 Пришлите скрин, где одновременно видны:\n🔤 Поисковый запрос «Микрофон , ргб , звук»\n🖼 Карточка нашего товара\n\nПрямую ссылку специально не даём — товар нужно найти именно через поиск.", "state": "same", "reg": []}, {"n": 124, "key": "a55e875692be", "anchor": "texts_giveaway.step3_text", "note": "", "text": "3️⃣ Шаг 3 из 7 · смотрим карточку\n\n⏱ Самый спокойный шаг: ничего присылать не нужно. Откройте страницу товара «Защитное стекло для iPhone 15 Pro» и побудьте на ней 1 минуту.\n\n👀 Пока ждёте:\n🖼 Пролистайте фото и видео\n💬 Прочитайте отзывы\n📋 Посмотрите характеристики и описание\n\n👉 Нажмите «➡ Продолжить», когда время выйдет — раньше бот попросит подождать.\n\nОтсчёт идёт сам, следить за ним не нужно.", "state": "same", "reg": []}, {"n": 125, "key": "57dc66446962", "anchor": "texts_giveaway.step3_too_early_alert", "note": "нажали «Дальше» рано", "text": "Ещё рано — побудьте в карточке ещё 1 секунду", "state": "same", "reg": []}, {"n": 126, "key": "85ad61d8693b", "anchor": "texts_giveaway.step3_too_early_text", "note": "", "text": "⏱ Ещё рано: подождите ещё 1 секунду.\n\n🖼 Побудьте на странице товара — листайте фото, отзывы и характеристики.", "state": "same", "reg": []}, {"n": 127, "key": "08a2704ed512", "anchor": "texts_giveaway.step4_text", "note": "", "text": "4️⃣ Шаг 4 из 7 · общая корзина\n\n⏹ Этот шаг останавливает таймер: примем скрин — место закрепится за вами, а шаг 5 откроется сразу.\n\n🧺 Добавьте наш товар «Защитное стекло для iPhone 15 Pro» в корзину.\n\n📷 Пришлите один скрин, где одновременно видны:\n📦 Наш товар\n🛍 2–3 похожих товара других магазинов, которые вы уже добавили", "state": "same", "reg": []}, {"n": 128, "key": "acc4873d56a3", "anchor": "texts_giveaway.cart_accepted_text", "note": "", "text": "✅ Общая корзина принята — место закреплено за вами.\n\n♾ Таймер остановлен: на шаги 5–7 времени сколько нужно.", "state": "same", "reg": []}, {"n": 129, "key": "58e126aa1995", "anchor": "texts_giveaway.step5_text", "note": "", "text": "5️⃣ Шаг 5 из 7 · оставляем один товар\n\n✂ Удалите из корзины лишние товары — должен остаться только наш товар «Защитное стекло для iPhone 15 Pro».\n\n📷 Пришлите новый скрин корзины, где это хорошо видно.", "state": "same", "reg": []}, {"n": 130, "key": "3efe819774e6", "anchor": "texts_giveaway.step6_text", "note": "", "text": "6️⃣ Шаг 6 из 7 · избранное\n\n🎯 Предпоследний шаг — дальше только оформление заказа.\n\n❤️ Добавьте в избранное:\n\n1. 🏪 Магазин —\n2. 📦 Наш товар «Защитное стекло для iPhone 15 Pro»\n\n📷 Пришлите один скрин, где одновременно видны оба действия.", "state": "same", "reg": []}, {"n": 131, "key": "fc8db52fdf8e", "anchor": "texts_giveaway.step7_wb_text", "note": "шаг 7: Wildberries", "text": "7️⃣ Шаг 7 из 7 · оформляем заказ\n\n🎯 Последний шаг — после него заявка уйдёт на проверку.\n\n💵 Пришлите итоговую сумму заказа на Wildberries — точную, с копейками, например 512,37.\n\n📎 Дальше попросим один скрин оформленного заказа. Ошиблись — сумму можно исправить до отправки скрина.\n\nНа Wildberries цена зависит от личной скидки, поэтому точная сумма подтверждает именно вашу покупку.", "state": "same", "reg": []}, {"n": 132, "key": "775d011ebebc", "anchor": "texts_giveaway.step7_order_text", "note": "шаг 7: Ozon / Яндекс", "text": "7️⃣ Шаг 7 из 7 · оформляем заказ\n\n🎯 Последний шаг — после него заявка уйдёт на проверку.\n\n🔢 Пришлите номер заказа, оформленного на Wildberries.\n\n🚫 Номер отправления и трек-номер не подойдут.\n\n📎 Дальше попросим один скрин оформленного заказа. Ошиблись — номер можно исправить до отправки скрина.\n\nНайти его можно в приложении маркетплейса, в списке ваших заказов.", "state": "same", "reg": []}, {"n": 133, "key": "1571222b9d9b", "anchor": "texts_giveaway.step7_screenshot_text", "note": "шаг 7: просим скрин заказа", "text": "✅ False сохранили.\n\n📎 Остался один кадр — и все семь шагов позади.\n\n📷 Пришлите скрин оформленного заказа, где видны:\n📦 Наш товар\n💵 Итоговая сумма\n📍 Адрес и название ПВЗ (или хотя бы название)", "state": "same", "reg": []}, {"n": 134, "key": "5c7e11b99813", "anchor": "texts_giveaway.wrong_content_text", "note": "прислали не картинку", "text": "📷 Нужен именно скрин или фото.\n\n🖼 Пришлите изображение — текстом этот шаг подтвердить нельзя.\n\nЕсли скрин никак не отправляется — напишите в 💬 Техподдержку, поможем.", "state": "same", "reg": []}, {"n": 135, "key": "40b94f300c12", "anchor": "bot/handlers/giveaways.py:879", "note": "прислали не картинку (вариант)", "text": "Прикрепите скриншот картинкой или файлом PNG/JPEG.", "state": "same", "reg": []}, {"n": 136, "key": "886391a0e039", "anchor": "bot/handlers/giveaways.py:882", "note": "картинка слишком большая", "text": "Картинка слишком большая. Пришлите обычный скриншот телефона.", "state": "same", "reg": []}, {"n": 137, "key": "4104a204c316", "anchor": "bot/handlers/giveaway_funnel.py:377-378", "note": "сохраняем кадр", "text": "📷 Сохраняю кадр…\n\nСекунду, забираю картинку и открываю следующий шаг.", "state": "same", "reg": []}, {"n": 138, "key": "6e45b99dbf62", "anchor": "bot/handlers/giveaway_funnel.py:487-488", "note": "сумму не разобрали", "text": "Не разобрали сумму. Пришлите итоговую сумму заказа числом, например 3490 или 3490.50.", "state": "same", "reg": []}, {"n": 139, "key": "c2aa4782e735", "anchor": "bot/handlers/giveaway_funnel.py:519", "note": "номер заказа не разобрали", "text": "Не разобрали номер заказа. Откройте «Мои заказы» на", "state": "same", "reg": []}, {"n": 140, "key": "bdee2f6aaac8", "anchor": "bot/handlers/giveaway_funnel.py:574-575", "note": "проверяем заказ", "text": "🔎 Проверяю заказ…\n\nСпрашиваю площадку, дошёл ли до неё ваш заказ.", "state": "same", "reg": []}, {"n": 141, "key": "9b83908d0955", "anchor": "bot/handlers/giveaway_funnel.py:705-709", "note": "заказ не сошёлся", "text": "🔐 Заказ не сошёлся: {…}\n\n\n✍️ Пришлите {…} ещё раз — остальные шаги сохранены, заново их проходить не нужно.\n⏱ Если заказ оформлен только что, подождите пару минут: он появляется у нас не мгновенно.", "state": "same", "reg": []}, {"n": 142, "key": "eb7c6e918b1c", "anchor": "bot/handlers/giveaways.py:773-782", "note": "заказ оформлен — что дальше", "text": "✅ Скрин принят: видны товар, сумма и ПВЗ.\n🎉 Заказ оформлен — первая часть позади.\n🗺 Дальше три шага:\nМенеджер проверит заказ и напишет вам.\nПридёт посылка — бот попросит короткий отчёт: фото товара с бирками, отзыв на маркетплейсе и лайк.\nПосле отчёта — сертификат {…} на сумму кэшбэка.\nНичего не потеряется: бот сам напомнит на каждом шаге.", "state": "same", "reg": []}, {"n": 143, "key": "2d98e80c1e35", "anchor": "texts_giveaway.order_confirmed_text", "note": "заказ подтверждён", "text": "✅ Заказ подтверждён — оформлено всё правильно.\n\n📦 Как получите товар, возвращайтесь в бот:\n📷 Скрин с датой получения\n✂ Фото порезанных бирок и штрих-кодов с упаковки\n\n⏳ Через 2–3 дня после получения бот сам напомнит подготовить отзыв, фото и видео на согласование. До этого отзыв публиковать не нужно.", "state": "same", "reg": []}, {"n": 144, "key": "7c2a4c253201", "anchor": "bot/handlers/giveaway_funnel.py:255", "note": "все шаги пройдены", "text": "Все шаги пройдены — заявка у менеджера. Загляните в «📊 Мои заявки».", "state": "same", "reg": []}, {"n": 145, "key": "51c9ba30337c", "anchor": "texts_giveaway.reminder_30_text", "note": "напоминание за 30 минут до конца брони", "text": "⏰ Место за вами ещё 30 минут.\n\n⚠️ Не принят шаг 1: «—».\n📋 Осталось отправить: —.\n\n👇 Кнопка ниже вернёт вас прямо к этому шагу.", "state": "same", "reg": []}, {"n": 146, "key": "d6223ce32e43", "anchor": "texts_giveaway.reservation_expired_text", "note": "бронь истекла", "text": "💾 Место освободилось, но всё присланное сохранено.\n\n⌛ 120 минут на шаги 1–4 закончились.\n\n🎁 Выберите этот товар в каталоге ещё раз — если места есть, продолжим с того шага, где остановились.", "state": "same", "reg": []}, {"n": 147, "key": "fb09fbe5e367", "anchor": "services/giveaways.py:112-115", "note": "бронь истекла (вариант)", "text": "⏰ Время на оформление истекло. Слот по раздаче {…} возвращён.\n\n\nТекущую заявку продолжить нельзя. Если товар ещё есть в каталоге раздач, можешь занять слот заново: нужно будет снова пройти все шаги с начала.", "state": "same", "reg": []}, {"n": 148, "key": "0d1a3473072c", "anchor": "bot/handlers/giveaways.py:421-425", "note": "время истекло, всплывающее окно", "text": "⏰ Время на оформление истекло.\n🚫 Текущую заявку продолжить нельзя.\nЕсли товар ещё есть в каталоге раздач, можно занять место заново — шаги придётся пройти с начала.", "state": "same", "reg": []}, {"n": 149, "key": "419637078644", "anchor": "bot/handlers/giveaway_funnel.py:774-782", "note": "нажали «Освободить место»", "text": "Место освободили. Всё, что вы успели прислать, сохранено — если передумаете, выберите товар в каталоге ещё раз.\nШаг", "state": "same", "reg": []}, {"n": 150, "key": "51ba446db7fa", "anchor": "bot/handlers/giveaway_funnel.py:366", "note": "активной заявки нет", "text": "Активной заявки нет. Откройте «🎁 Раздачи» и выберите товар.", "state": "same", "reg": []}, {"n": 151, "key": "6f17d13ea222", "anchor": "bot/handlers/giveaways.py:445-447", "note": "заявку нельзя завершить", "text": "❌ Заявку нельзя завершить.\n🎁 Откройте «Раздачи» и попробуйте снова.", "state": "same", "reg": []}, {"n": 152, "key": "b95b6ba6fecd", "anchor": "bot/handlers/giveaways.py:597-599", "note": "«Мои заявки»: пусто", "text": "📊 Заявок по раздачам пока нет.\n🎁 Загляните в каталог — там видно свободные места и номинал сертификата.", "state": "same", "reg": []}, {"n": 153, "key": "b9e3fba9c4ae", "anchor": "giveaways.py:605-636 — «Мои заявки»: строки карточки (варианты)", "note": "", "text": "• 📊 Мои заявки\n• выбирается после заказа\n• 💰 Кэшбэк: 575 ₽\n · сертификат: выбирается после заказа\n• 🔑 Код: OZON-XXXX-YYYY\n• 💬 Причина: скрин не читается\n• 📝 Отправить отчёт · Микрофон игровой…", "state": "same", "reg": []}, {"n": 154, "key": "0f9fd4c22e7d", "anchor": "bot/handlers/giveaways.py:661", "note": "«Мой кэшбэк»: пусто", "text": "💵 Пока нет заявок, готовых к выдаче сертификата.", "state": "same", "reg": []}, {"n": 155, "key": "586441ee5864", "anchor": "giveaways.py:664-674 — «Мой кэшбэк»: строки (статусы — варианты)", "note": "", "text": "• 💵 Мой кэшбэк\n• ожидает сертификат\nсертификат отправлен\n• 🔑 Код: OZON-XXXX-YYYY", "state": "same", "reg": []}, {"n": 156, "key": "4b031463d322", "anchor": "texts_giveaway.notifications_text", "note": "кнопка «🔔 Уведомления»", "text": "🔔 Уведомления о раздачах\n\n🎯 Здесь только приглашения в раздачи — на другие сообщения бота это не влияет.\n\n🚫 «Не интересно» — скроем один конкретный товар.\n🔕 «Не получать раздачи» — отключим все будущие приглашения.\n\n▸ 💾 Начатые заявки, гарантия и билеты останутся на месте.\n🔔 Включить приглашения обратно можно здесь же.", "state": "same", "reg": []}, {"n": 157, "key": "ac86b2c72d3b", "anchor": "texts_giveaway.enabled_all_text", "note": "", "text": "🔔 Приглашения на раздачи включены.\n\n🎁 Пришлём карточку, как только появится новый товар.", "state": "same", "reg": []}, {"n": 158, "key": "b5fce3a7e304", "anchor": "texts_giveaway.disabled_all_text", "note": "", "text": "🔕 Приглашения на новые раздачи выключены.\n\n🔔 Включить обратно можно там же, в «🔔 Уведомления», — кнопкой «🔔 Получать раздачи».\n\n▸ 💾 Активная заявка, гарантия и уже назначенный сертификат остаются в силе — на них это не влияет.", "state": "same", "reg": []}, {"n": 159, "key": "cbc462ec137e", "anchor": "services/giveaways.py:233-235", "note": "рассылка о новой раздаче", "text": "🎁 Новая раздача: Микрофон игровой для ПК\n\n30% кэшбэк сертификатом Wildberries или Ozon\n\n\nНажми «Открыть», чтобы посмотреть условия и занять слот.", "state": "same", "reg": []}, {"n": 160, "key": "ed736ad9fe08", "anchor": "services/giveaways.py:148-150", "note": "раздача ушла в следующую волну", "text": "Раздача Микрофон игровой для ПК ушла дальше: ты не успел открыть её в первой волне.\n\nЗагляни в «🎁 Раздачи» — там могут быть другие активные товары.", "state": "same", "reg": []}, {"n": 161, "key": "743afbd0e6e0", "anchor": "texts_giveaway.certificate_sent_text", "note": "оператор выдал сертификат из админки", "text": "🎁 Сертификат на 1 917 ₽ — ваш.\n\n🟣 Маркетплейс: Wildberries\n📦 Раздача: Микрофон игровой для ПК\n\n🔑 Код сертификата:\nOZON-XXXX-YYYY\n\n👉 Активируйте его в приложении маркетплейса, в разделе с промокодами и сертификатами.\n\nНажмите на код — он скопируется целиком.\n\n🙌 Спасибо, что прошли весь путь до конца!", "state": "same", "reg": []}, {"n": 162, "key": "1af93e1f605c", "anchor": "texts_giveaway_report.report_intro_text", "note": "", "text": "🎁 Пять шагов — и вернём часть суммы сертификатом\n\n💳 Сертификат придёт на 15-й день после получения товара.\n\n📋 Что предстоит:\n\n1. 📷 Скрин получения с датой\n2. ✂ Фото порезанных бирок и штрих-кодов\n3. ⭐ Через 2–3 дня — отзыв на 5 звёзд, фото и видео на согласование\n4. 📢 Публикация согласованного отзыва\n5. ❤️ Лайк чужого отзыва на 5 звёзд в нашей карточке\n\nПро отзыв напомним сами — держать даты в голове не нужно.", "state": "same", "reg": []}, {"n": 163, "key": "8a32be984303", "anchor": "texts_giveaway_report.report_step1_text", "note": "", "text": "📦 Скрин получения — с него пойдёт отсчёт до сертификата\n\n📷 Пришлите кадр из приложения маркетплейса: видно, что заказ получен, и указана дата получения.\n\n📅 От этой даты считаем 2–3 дня до отзыва и 15 дней до кэшбэк-сертификата.", "state": "same", "reg": []}, {"n": 164, "key": "10f70e06527c", "anchor": "texts_giveaway_report.report_step2_text", "note": "", "text": "✂ Второй шаг — и можно отдыхать пару дней\n\n📷 Пришлите чёткое фото порезанных бирок и штрих-кодов с упаковки: на снимке должно быть видно, что коды разрезаны.\n\n▸ 🔍 По разрезанным кодам товар уже не вернуть — это и подтверждает кадр.", "state": "same", "reg": []}, {"n": 165, "key": "f884bb572fe4", "anchor": "texts_giveaway_report.report_wait_text", "note": "пауза 2–3 дня", "text": "✅ Два шага позади — дальше пауза\n\n🔔 — — напомним подготовить отзыв на 5 звёзд, фото и видео.\n💳 — — плановая дата кэшбэк-сертификата.\n\n🔕 До напоминания делать ничего не нужно, публиковать отзыв рано.", "state": "same", "reg": []}, {"n": 166, "key": "e02b6606a215", "anchor": "texts_giveaway_report.review_time_text", "note": "напоминание: пора отзыв", "text": "✍️ Отзыв на товар «Защитное стекло для iPhone 15 Pro» ещё ждём.\n\n📎 Соберите и пришлите нам на согласование:\n\n⭐ Текст отзыва с оценкой 5 звёзд\n📷 Фото товара\n🎬 Видео — если получится снять\n\n🚫 Публиковать отзыв самостоятельно пока не нужно.\n\n❗️ Без отзыва сертификат не выпускаем — это обязательное условие раздачи.\n\n🔔 Это последнее напоминание.", "state": "same", "reg": []}, {"n": 167, "key": "a78dda527188", "anchor": "texts_giveaway_report.report_step3_text", "note": "", "text": "⭐ Сначала покажите отзыв нам — так его не придётся снимать\n\n📎 Пришлите оператору на согласование:\n\n💬 Текст отзыва с оценкой 5 звёзд\n📷 Фотографии товара\n🎬 Видео товара — если получится, без него отзыв не отклоняем\n\n📨 По одному сообщению, сколько нужно. Всё собрали — нажмите «✅ Готово, отправить оператору».\n\n❗️ Не публикуйте отзыв, пока оператор не подтвердил материалы — иначе его придётся снимать.", "state": "same", "reg": []}, {"n": 168, "key": "dd10a000acb7", "anchor": "bot/handlers/giveaway_report.py:587", "note": "ждём материалы", "text": "Пришлите текст отзыва, фото или видео — по одному сообщению.", "state": "same", "reg": []}, {"n": 169, "key": "6965be393a8f", "anchor": "texts_giveaway_report.material_added_text", "note": "", "text": "✅ Приняли, всё на месте.\n\n💬 Текст отзыва\n📷 Фото: 1\n\n📨 Есть что добавить — присылайте. Закончили — нажмите «✅ Готово, отправить оператору».", "state": "same", "reg": []}, {"n": 170, "key": "47bfa2ae61f4", "anchor": "texts_giveaway_report.nothing_to_send_text", "note": "", "text": "✋ Пока нечего отправлять.\n\n📎 Нужен текст отзыва и хотя бы одно фото — пришлите их сюда.", "state": "same", "reg": []}, {"n": 171, "key": "1a1289d86da5", "anchor": "texts_giveaway_report.review_sent_text", "note": "", "text": "📨 Материалы у оператора — ответим в течение дня\n\n👤 Оператор смотрит текст, фото и видео.\n🔔 Одобрит — придёт отдельное сообщение, и можно публиковать.\n\n▸ ✏️ Если что-то нужно поправить, бот назовёт один конкретный материал — остальные шаги не сбрасываются.", "state": "same", "reg": []}, {"n": 172, "key": "e7ae5d25d04b", "anchor": "texts_giveaway_report.review_approved_text", "note": "", "text": "✅ Отзыв согласован — публикуйте\n\n📢 Поставьте оценку 5 звёзд и выложите ровно те материалы, которые согласовали.\n\n📷 После публикации пришлите скрин, где видно товар, оценку и текст отзыва.", "state": "same", "reg": []}, {"n": 173, "key": "b52f12173bf8", "anchor": "texts_giveaway_report.report_step4_text", "note": "", "text": "📷 Предпоследний шаг — скрин опубликованного отзыва\n\n🖼 Пришлите кадр, где на одном экране видно:\n\n📦 наш товар\n⭐ оценку 5 звёзд\n💬 текст отзыва\n🎬 опубликованные фото или видео\n\n▸ 👤 Если автоматическая проверка засомневается, скрин посмотрит оператор — это обычная ситуация.", "state": "same", "reg": []}, {"n": 174, "key": "c4612527cbd7", "anchor": "texts_giveaway_report.report_step5_text", "note": "", "text": "❤️ Последний шаг — и отчёт сдан\n\n👉 Откройте карточку нашего товара и поставьте лайк чужому отзыву с оценкой 5 звёзд.\n\n📷 Пришлите скрин, где видно сам отзыв, пять звёзд и что лайк уже стоит.", "state": "same", "reg": []}, {"n": 175, "key": "c2ac2b637f87", "anchor": "texts_giveaway_report.cashback_planned_text", "note": "", "text": "🎉 Отчёт сдан — сертификат за нами\n\n💵 Сумма сертификата: 5 000 ₽\n📅 Плановая дата: 03.09.2026\n\n🧾 На 15-й день попросим один скрин текущего статуса заказа — остальные материалы повторять не нужно.\n\n🎁 После проверки код придёт отдельным сообщением и сохранится в разделе «💵 Мой кэшбэк».\n\n▸ 🧑‍💼 Оператор сверит скрин: заказ получен и не возвращён.\n\nЕсли 15-й день выпадает на выходные, сертификат может прийти на 16-й — это нормально, делать ничего не нужно.", "state": "same", "reg": []}, {"n": 176, "key": "b6733724c80c", "anchor": "texts_giveaway_report.order_status_request_text", "note": "15-й день: просим скрин статуса", "text": "🧾 Один скрин — и выпускаем сертификат\n\n📷 Пришлите скрин страницы заказа, где виден его текущий статус.\n\n⏳ Ждём его в течение 3 дней — позже выплату поставим на ручную проверку, это дольше.\n\n💾 Остальные материалы повторять не нужно.\n\n▸ 🔍 Маркетплейс не передал статус автоматически, поэтому проверяем по кадру, не оформлен ли возврат.", "state": "same", "reg": []}, {"n": 177, "key": "906820c68481", "anchor": "bot/handlers/giveaway_report.py:365-369", "note": "просим скрин статуса (вариант)", "text": "🧾 Пришлите скрин страницы заказа\n📦 виден сам заказ,\n🏷 виден его текущий статус.\nОдного кадра достаточно. Остальные материалы повторять не нужно.", "state": "same", "reg": []}, {"n": 178, "key": "33852798f006", "anchor": "bot/handlers/giveaway_report.py:400-403", "note": "скрин статуса получили", "text": "✅ Скрин получили.\n🧑‍💼 Оператор сверит статус заказа и выпустит сертификат.\nКод придёт сюда же отдельным сообщением. Делать больше ничего не нужно.", "state": "same", "reg": []}, {"n": 179, "key": "b66dab947a2a", "anchor": "bot/handlers/giveaway_report.py:459", "note": "активной заявки нет", "text": "Активной заявки нет. Загляните в «📊 Мои заявки».", "state": "same", "reg": []}, {"n": 180, "key": "f9a65085ad3c", "anchor": "bot/handlers/giveaway_report.py:469-470", "note": "сохраняем кадр", "text": "📷 Сохраняю кадр…\n\nСекунду, забираю картинку и открываю следующий шаг.", "state": "same", "reg": []}]}, {"title": "Системные: ошибки, уточнения, сбои", "intro": "Ответы на неверный ввод, отказы проверки, потерянные шаги.", "items": [{"n": 181, "key": "ced51662200e", "anchor": "bot/handlers/contact.py:45", "note": "прислали чужой контакт вместо своего", "text": "Пожалуйста, поделитесь своим контактом, а не чужим.", "state": "same", "reg": []}, {"n": 182, "key": "db5ba6403830", "anchor": "bot/handlers/profile.py:357", "note": "написали текст вместо нажатия кнопки", "text": "Выберите вариант кнопкой в сообщении выше 👆", "state": "same", "reg": []}, {"n": 183, "key": "e7448b642b14", "anchor": "bot/middlewares.py:73-75", "note": "заблокированный аккаунт пишет боту", "text": "🚫 Ваш аккаунт заблокирован.\n\nЕсли считаете, что это ошибка, напишите в поддержку — оператор разберёт вручную.", "state": "same", "reg": []}, {"n": 184, "key": "03ceaa4a75e3", "anchor": "bot/middlewares.py:152", "note": "заблокированный аккаунт, всплывающее окно", "text": "Ваш аккаунт заблокирован. Нажмите «💬 Техподдержка».", "state": "same", "reg": []}, {"n": 185, "key": "ddc9d3dda6a8", "anchor": "bot/handlers/warranty.py:473-474", "note": "пока проверяем скрин", "text": "🔎 Смотрим фото экрана…\n\nПроверяем, что на кадре виден товар, оценка и текст отзыва.", "state": "same", "reg": []}, {"n": 186, "key": "7a1143c4928f", "anchor": "services/vision.py:318", "note": "скрин отклонён: не отзыв", "text": "Это не похоже на страницу отзыва. Пришлите фото экрана, где виден сам отзыв.", "state": "same", "reg": ["D15"]}, {"n": 187, "key": "6af53f372506", "anchor": "services/vision.py:331-332", "note": "скрин отклонён: нет даты", "text": "Не увидели дату отзыва. Сделайте фото экрана так, чтобы дата публикации была в кадре — она нужна, чтобы сопоставить с датой вашей покупки.", "state": "same", "reg": ["D15"]}, {"n": 188, "key": "b6aba99ad116", "anchor": "services/vision.py:283", "note": "скрин отклонён: не читается", "text": "Не удалось разобрать фото экрана. Попробуйте прислать другое — чётче и без обрезов.", "state": "same", "reg": ["D15"]}, {"n": 189, "key": "c0877250e479", "anchor": "services/vision.py:268", "note": "скрин отклонён: сбой проверки", "text": "Не смогли проверить фото экрана (ошибка сервиса). Попробуйте ещё раз через минуту.", "state": "same", "reg": ["D15"]}, {"n": 190, "key": "84b968ed45d7", "anchor": "bot/handlers/warranty.py:563-564", "note": "прислали текст вместо картинки", "text": "Нужно фото экрана с отзывом — картинкой. Пришлите изображение: текстом отзыв присылать не нужно.", "state": "same", "reg": []}, {"n": 191, "key": "74ae06cf8e9b", "anchor": "texts_warranty.low_rating_text(1)", "note": "оценка ниже 5", "text": "⭐ Нужна оценка 5 звёзд.\n\n🔎 На фото экрана видно 1. Гарантию и билет оформляем по отзыву с оценкой 5.\n\n💬 Если с товаром что-то не так — напишите в «Техподдержку», разберёмся.\n\n▸ Отзыв на маркетплейсе после публикации не редактируется — переснимать смысла нет.", "state": "same", "reg": []}, {"n": 192, "key": "87d1f90cd450", "anchor": "texts_warranty.low_rating_text(4)", "note": "оценка ниже 5", "text": "⭐ Нужна оценка 5 звёзд.\n\n🔎 На фото экрана видно 4. Гарантию и билет оформляем по отзыву с оценкой 5.\n\n💬 Если с товаром что-то не так — напишите в «Техподдержку», разберёмся.\n\n▸ Отзыв на маркетплейсе после публикации не редактируется — переснимать смысла нет.", "state": "same", "reg": []}, {"n": 193, "key": "007cb3260f66", "anchor": "texts_warranty.needs_input_text(amount)", "note": "нужно уточнение, поле: amount", "text": "🔎 На скрине не видно дату отзыва.\n\n💵 Пришлите точную сумму покупки.", "state": "changed", "reg": []}, {"n": 194, "key": "a381ffe86c4d", "anchor": "texts_warranty.needs_input_text(order)", "note": "нужно уточнение, поле: order", "text": "🔎 На скрине не видно дату отзыва.\n\n🔢 Пришлите номер заказа.", "state": "changed", "reg": []}, {"n": 195, "key": "0da64aa3b6de", "anchor": "texts_warranty.needs_input_text(screenshot)", "note": "нужно уточнение, поле: screenshot", "text": "🔎 На скрине не видно дату отзыва.\n\n📷 Пришлите фото экрана с отзывом.", "state": "changed", "reg": []}, {"n": 196, "key": "4d0c19d21027", "anchor": "warranty.py:753-775 — кнопки под уточнением", "note": "", "text": "• Прислать сумму\n• Прислать номер заказа\n• Прислать фото экрана\n• Прислать исправление", "state": "same", "reg": []}, {"n": 197, "key": "6188c4567375", "anchor": "warranty.py:798-800 — после нажатия «Прислать…»", "note": "", "text": "• Пришлите точную сумму покупки с копейками — например 512,37.\n• Пришлите номер заказа — только цифры.\n• Пришлите новое фото экрана с опубликованным отзывом.", "state": "same", "reg": []}, {"n": 198, "key": "ceac2e37ec49", "anchor": "bot/handlers/warranty.py:589-590", "note": "сумму не разобрали", "text": "Не разобрали сумму. Пришлите её числом — например 512,37 или 3490.", "state": "same", "reg": []}, {"n": 199, "key": "dbbbc3913877", "anchor": "bot/handlers/warranty.py:650-651", "note": "номер заказа Ozon не разобрали", "text": "Не разобрали номер заказа. Он есть в разделе «Мои заказы» на Ozon и выглядит так: 0157262141-0136.", "state": "same", "reg": []}, {"n": 200, "key": "eeadeeb707dc", "anchor": "bot/handlers/warranty.py:659", "note": "номер Яндекса слишком короткий", "text": "В номере должно быть минимум {…} цифр,", "state": "new", "reg": []}, {"n": 201, "key": "f5692b24d35e", "anchor": "bot/handlers/warranty.py:664-666", "note": "в номере Яндекса нет цифр", "text": "Не нашли в сообщении ни одной цифры. Номер заказа Яндекс Маркета выглядит так: 31415926 — он в разделе «Мои заказы».", "state": "same", "reg": []}, {"n": 202, "key": "3ab17f1f113e", "anchor": "warranty.py:686-691 — варианты строки «От вас сейчас»", "note": "", "text": "• ничего, ждём проверку\n• прислать уточнение\n• ничего, всё готово\n• можно подтвердить другую покупку\n• ничего", "state": "same", "reg": []}, {"n": 203, "key": "3c4973c0bdc0", "anchor": "texts_warranty.mp_unavailable_text", "note": "маркетплейс не отвечает", "text": "🔧 Wildberries временно не отвечает.\n\n✅ От вас сейчас ничего не нужно — заявка сохранена.\n🔁 Повторим проверку сами примерно через сутки.\n\nЕсли связь не восстановится и дальше, заявку посмотрит оператор.", "state": "same", "reg": []}, {"n": 204, "key": "deb7b5ab646a", "anchor": "bot/handlers/warranty.py:461", "note": "заявка потерялась", "text": "Заявка не найдена. Начните заново из главного меню.", "state": "same", "reg": []}, {"n": 205, "key": "b6fa5f1015c1", "anchor": "bot/handlers/warranty.py:194-195", "note": "вышли из оформления кнопкой меню", "text": "↩️ Вышли из оформления гарантии.\n👇 Начать заново — кнопка «🛡 Активировать гарантию» ниже.", "state": "changed", "reg": []}, {"n": 206, "key": "28cb024087fe", "anchor": "bot/handlers/fallback.py:37-39", "note": "скрин прислали вне шага", "text": "📷 Мы не ждали от вас снимок.\nПохоже, шаг прервался — так бывает, если бот в этот момент обновлялся.", "state": "changed", "reg": []}]}], "buttons": [["Нижнее меню", ["✅ Принять и продолжить", "🛡 Гарантия", "📦 Мои покупки", "🎁 Раздачи", "🎬 Как поклеить", "💬 Техподдержка", "🏆 Топ призов", "🤝 Магазины партнёров", "✖️ Отмена"]], ["Ответы в анкете", ["👨 Мужчина", "👩 Женщина", "До 18", "18–24", "25–34", "35–44", "45–54", "55 и старше", "🍏 iPhone", "🤖 Android"]], ["Гарантия", ["🟣 Wildberries", "🔵 Ozon", "🟡 Яндекс", "🎬 Как написать отзыв", "↩️ Выбрать другой маркетплейс", "📋 Статус заявки", "➕ Активировать ещё одну гарантию", "Прислать сумму", "Прислать номер заказа", "Прислать фото экрана", "Прислать исправление", "🎁 Да, присылайте", "🔕 Не сейчас"]], ["Мои покупки", ["‹ Назад", "Вперёд ›"]], ["Как поклеить", ["📱 Стекло обычное", "⚙️ Автоустановка", "🖥 Стекло на iPad", "⚙️ Стекло на iPad с автоустановкой", "📷 Стекло на камеру", "💧 Плёнка на телефон", "💧 Плёнка на iPad", "◀️ Другие ролики"]], ["Техподдержка", ["👤 Написать оператору", "📋 Статус обращения", "⬅️ Выйти из поддержки"]], ["Опрос", ["🗣 Пройти опрос", "⏭ Не сейчас", "🚫 Никогда не участвовать", "➡️ Продолжить", "📌 Статус опроса"]], ["Розыгрыш", ["🎟 Ваш выигравший билет"]], ["Раздачи", ["🎁 Смотреть товары", "🎁 Каталог раздач", "🎁 К товарам", "📊 Мои заявки", "💵 Мой кэшбэк", "🔔 Уведомления", "✅ Участвую", "⬅️ Назад", "➡ Продолжить", "▶ Вернуться к шагу N", "❌ Освободить место", "⏭ Досмотрел, дальше", "🔔 Получать раздачи", "🔕 Не получать раздачи", "Открыть"]], ["Отчёт по раздаче", ["📦 Начать отчёт", "✍️ Продолжить отчёт", "✅ Готово, отправить оператору", "📷 Отправить скрин заказа"]], ["Рассылки", ["🚫 Отписаться от рассылок"]]], "built": "07.09.2026", "total": 206, "changed": 34, "new": 1}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const $ = (s, r=document) => r.querySelector(s);
  const state = {checks: {}, filter: 'all', q: '', db: null};
  const who = $('#who');
  try { who.value = localStorage.getItem('acc_name') || ''; } catch(e){}
  who.addEventListener('change', () => { try { localStorage.setItem('acc_name', who.value.trim()); } catch(e){} });

  const allItems = [];
  data.sections.forEach(s => s.items.forEach(it => allItems.push(it)));
  $('#sub').textContent = `${data.total} экранов · собрано из кода ${data.built} · изменилось после показа: ${data.changed}, новых: ${data.new}`;

  function esc(t){ return t.replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;'); }
  function renderText(t){
    // тексты — наши, из кода бота; разрешаем только телеграмовские теги
    let s = esc(t).replace(/<(?!\/?(b|i|u|s|code|pre|blockquote|a|tg-spoiler)(\s[^>]*)?>)/g, '&lt;');
    s = s.replace(/<a\s+href="([^"]*)">/g, '<a href="$1" target="_blank" rel="noopener">');
    return s.replace(/\\n/g, '\n');
  }

  const main = $('#main'), nav = $('#nav');
  data.sections.forEach((sec, si) => {
    const id = 'sec' + si;
    const block = document.createElement('section');
    block.className = 'block'; block.id = id;
    block.innerHTML = `<h2>${sec.title} <small data-count="${id}"></small></h2><p class="intro">${sec.intro || ''}</p><div class="cards"></div>`;
    const cards = block.querySelector('.cards');
    sec.items.forEach(it => {
      const c = document.createElement('article');
      c.className = 'card'; c.dataset.key = it.key; c.dataset.state = it.state; c.dataset.text = (it.text + ' ' + it.note + ' ' + it.anchor).toLowerCase();
      const tags = [];
      if (it.state === 'new') tags.push('<span class="tag new">новое</span>');
      if (it.state === 'changed') tags.push('<span class="tag changed">исправлено</span>');
      it.reg.forEach(r => tags.push(`<span class="tag reg">${r}</span>`));
      c.innerHTML = `<div class="meta"><span class="n">№${it.n}</span>${tags.join('')}</div>` +
        (it.note ? `<div class="note hint">${esc(it.note)}</div>` : '') +
        `<div class="bubble">${renderText(it.text)}</div>` +
        `<div class="anchor">${esc(it.anchor)}</div>` +
        `<textarea class="remark" rows="1" placeholder="Замечание (сохраняется для всех)"></textarea>` +
        `<div class="check"><label><input type="checkbox"> Проверено</label><span class="by"></span></div>`;
      cards.appendChild(c);
    });
    main.appendChild(block);
    const a = document.createElement('a');
    a.href = '#' + id; a.innerHTML = `<span>${sec.title.replace(/ *\(.*\)/, '')}</span><small data-nav="${id}"></small>`;
    nav.appendChild(a);
  });
  if (data.buttons && data.buttons.length){
    const block = document.createElement('section');
    block.className = 'block'; block.id = 'buttons';
    block.innerHTML = `<h2>Надписи на кнопках</h2><p class="intro">Дословно из кода. Название раздела в тексте обязано совпадать с надписью на кнопке.</p>`;
    data.buttons.forEach(([name, items]) => {
      const d = document.createElement('div');
      d.style.marginBottom = '12px';
      d.innerHTML = `<div class="note" style="margin-bottom:6px">${esc(name)}</div><div class="btns">${items.map(b => `<span class="btn">${esc(b)}</span>`).join('')}</div>`;
      block.appendChild(d);
    });
    main.appendChild(block);
    const a = document.createElement('a'); a.href = '#buttons'; a.innerHTML = '<span>Кнопки</span>'; nav.appendChild(a);
  }

  function applyFilter(){
    const q = state.q;
    document.querySelectorAll('.card').forEach(c => {
      const ch = state.checks[c.dataset.key] || {};
      let show = true;
      if (state.filter === 'changed') show = c.dataset.state !== 'same';
      else if (state.filter === 'todo') show = !ch.ok;
      else if (state.filter === 'remarks') show = !!(ch.note && ch.note.trim());
      if (show && q) show = c.dataset.text.includes(q);
      c.classList.toggle('hidden', !show);
    });
  }
  function paintChecks(){
    let done = 0;
    document.querySelectorAll('.card').forEach(c => {
      const ch = state.checks[c.dataset.key] || {};
      const box = c.querySelector('input[type=checkbox]');
      box.checked = !!ch.ok; c.classList.toggle('ok', !!ch.ok);
      if (ch.ok) done++;
      c.querySelector('.by').textContent = ch.ok ? `${ch.by || ''} · ${ch.at || ''}` : '';
      const r = c.querySelector('.remark');
      if (document.activeElement !== r) r.value = ch.note || '';
    });
    $('#ptext').textContent = `${done} из ${data.total}`;
    $('#pbar').style.width = (100 * done / Math.max(1, data.total)) + '%';
    data.sections.forEach((sec, si) => {
      const id = 'sec' + si;
      const n = sec.items.filter(it => (state.checks[it.key] || {}).ok).length;
      const t = `${n}/${sec.items.length}`;
      const el = document.querySelector(`[data-count="${id}"]`); if (el) el.textContent = 'проверено ' + t;
      const nv = document.querySelector(`[data-nav="${id}"]`); if (nv) { nv.textContent = t; nv.parentElement.classList.toggle('done', n === sec.items.length); }
    });
    applyFilter();
  }
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); state.filter = b.dataset.f; applyFilter();
  }));
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); applyFilter(); });

  function stamp(){ const d = new Date(); return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
  function needName(){
    let n = who.value.trim();
    if (!n) { n = (prompt('Как вас подписать в галочках?') || '').trim(); if (n) { who.value = n; try { localStorage.setItem('acc_name', n); } catch(e){} } }
    return n;
  }
  const LS_KEY = 'acc_checks_v1';
  function saveLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state.checks)); } catch(e){ console.warn('localStorage', e); }
  }
  async function save(key, patch){
    const cur = Object.assign({}, state.checks[key] || {}, patch);
    state.checks[key] = cur; paintChecks();
    if (!state.db) { saveLocal(); return; }
    try { await state.db.doc('checks/' + key).set(cur); }
    catch(e){ console.warn('db set', e); }
  }

  // Отчёт текстом: на странице без общей базы это единственный способ
  // вернуть замечания — скопировал и отправил в чат.
  $('#report').addEventListener('click', async () => {
    const lines = [], remarks = [], todo = [];
    let done = 0;
    allItems.forEach(it => {
      const ch = state.checks[it.key] || {};
      if (ch.ok) done++;
      if (ch.note) remarks.push(`№${it.n} (${it.anchor}): ${ch.note}`);
      if (!ch.ok && it.state !== 'same') todo.push(`№${it.n} ${it.anchor}`);
    });
    lines.push(`Приёмочная карта GiftsActivate, версия кода ${data.built}`);
    lines.push(`Смотрел(а): ${who.value.trim() || 'без имени'} · ${stamp()}`);
    lines.push(`Проверено ${done} из ${data.total}`);
    if (remarks.length) lines.push('', 'Замечания:', ...remarks);
    if (todo.length) lines.push('', `Изменённые экраны без галочки (${todo.length}):`, ...todo.slice(0, 40));
    const text = lines.join('\n');
    const btn = $('#report');
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Скопировано'; }
    catch(e){ window.prompt('Скопируйте отчёт:', text); btn.textContent = 'Скопировать отчёт'; }
    setTimeout(() => { btn.textContent = 'Скопировать отчёт'; }, 2000);
  });
  main.addEventListener('change', e => {
    const c = e.target.closest('.card'); if (!c) return;
    if (e.target.type === 'checkbox'){
      const on = e.target.checked;
      const name = on ? needName() : '';
      if (on && !name) { e.target.checked = false; return; }
      save(c.dataset.key, on ? {ok: true, by: name, at: stamp()} : {ok: false, by: '', at: ''});
    } else if (e.target.classList.contains('remark')){
      save(c.dataset.key, {note: e.target.value.trim(), noteBy: who.value.trim(), noteAt: stamp()});
    }
  });
  paintChecks();

  function goLocal(){
    // Общей базы нет (страница вне claude.ai): галочки живут в этом браузере,
    // вернуть их можно кнопкой «Скопировать отчёт».
    state.db = null;
    try { state.checks = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e){ state.checks = {}; }
    const el = $('#offline');
    el.textContent = 'Галочки и замечания сохраняются только в этом браузере — у каждого свои. Закончите — нажмите «Скопировать отчёт» и пришлите текст в чат.';
    el.hidden = false;
    paintChecks();
  }
  (async () => {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
    if (!db) { goLocal(); return; }
    state.db = db;
    db.collection('checks').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      state.checks = next; paintChecks();
    }, err => { console.warn('db', err); goLocal(); });
  })();
})();
</script>
