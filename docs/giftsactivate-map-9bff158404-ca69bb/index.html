body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}

.pane.q{background:var(--qbg)}

.mtag{font-size:11px;color:var(--muted);margin-bottom:3px}
.kbrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.kb{background:var(--bubble);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 2px}
.qnote{font-size:13.5px;line-height:1.45}
.hint{margin-top:7px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.anch{font:11px "JetBrains Mono",monospace;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:12px;color:var(--muted);margin:10px 0 2px}

57735", "title": "/start во время оформления", "anchor": "qa.warranty[29] · qa.lambda: fmt.screen( \"↩️ \" + fmt.title(\"Вышли из оформления гарантии.\"), \"👇 Начать заново — кнопка «🛡 Активировать гарантию» ниже.\", ),", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">↩️ <b>Вышли из оформления гарантии.<\/b><br><br>👇 Начать заново — кнопка «🛡 Активировать гарантию» ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">🛡 Активировать гарантию<\/span><span class=\"kb\">🎁 Раздачи<\/span><span class=\"kb\">🎬 Как поклеить<\/span><span class=\"kb\">💬 Техподдержка<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">↩️ Вышли из процесса оформления гарантии.<br><br>👇 Чтобы начать заново, нажми кнопку «🛡 Активировать гарантию» ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">🛡 Активировать гарантию<\/span><span class=\"kb\">🎁 Раздачи<\/span><span class=\"kb\">🎬 Как поклеить<\/span><span class=\"kb\">💬 Техподдержка<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 50, "key": "eae2afa7b491", "title": "Исправление: новая сумма", "anchor": "qa.warranty[30] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Пришлите точную сумму покупки с копейками — например <code>512,37<\/code>.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Пришли точную сумму покупки с копейками. Пример 512,37.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 51, "key": "6b4f4553c15e", "title": "Исправление: номер заказа", "anchor": "qa.warranty[31] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Пришлите номер заказа — только цифры.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Укажи номер заказа цифрами, без лишних символов и букв.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 52, "key": "fb0cfb200edc", "title": "Исправление: новый скрин", "anchor": "qa.warranty[32] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Пришлите новое фото экрана с опубликованным отзывом.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Сделай новый скриншот с опубликованным отзывом и отправь его сюда!<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 53, "key": "444dd207ad46", "title": "Ручной отказ оператора", "anchor": "qa.warranty[33] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">❌ <b>Покупку пока не удалось подтвердить.<\/b><br><br>Причина: На снимке не видны данные покупки.<br><br>Если данные верны, напишите в техподдержку.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">❌ Покупку пока не удалось подтвердить.<br><br>Причина: На фото плохо видно информацию о покупке<br><br>Если всё указано верно, напиши в техподдержку!<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 54, "key": "262f5590fd0a", "title": "Заявка потеряна до загрузки скрина", "anchor": "qa.warranty[34] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Заявка не найдена. Начните заново из главного меню.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Не получилось найти твою заявку. Вернись в главное меню и попробуй ещё раз.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}]}, {"title": "Видеоуроки", "items": [{"n": 55, "key": "556e46740f45", "title": "Меню видеоинструкций", "anchor": "qa.howto[0] · handlers.howto._intro_text", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">🎬 <b>Как поклеить стекло или плёнку<\/b><br><br>🫧 Короткие видео: как наклеить ровно, без пузырей и пыли, с первого раза.<\/div><div class=\"kbrow\"><span class=\"kb\">📱 Стекло · телефон<\/span><span class=\"kb\">🖥 Стекло · iPad<\/span><span class=\"kb\">📷 Стекло · камера<\/span><span class=\"kb\">💧 Плёнка · телефон<\/span><span class=\"kb\">💧 Плёнка · iPad<\/span><span class=\"kb\">⚙️ Стекло на телефон с автоустановкой<\/span><span class=\"kb\">⚙️ Стекло на iPad с автоустановкой<\/span><\/div><\/div>", "new": "", "note_new": "все с заглавной надо <br><br>🎬 Как поклеить стекло или плёнку<br><br>🫧 Короткие видео: как наклеить ровно, без пыли и пузырей с первого раза.<br><br>👇 Выбирай, что будешь клеить:<br><br>🖼 Стекло с рамкой и без<br>💧 Плёнка на телефон<br>🖥 Планшет или iPad<br>📷 Стекло на камеру", "hint": "", "v": "stale"}, {"n": 56, "key": "0ec548d68ac8", "title": "Стекло на телефон", "anchor": "qa.howto[1] · custom:lesson:glass_plain", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>📱 Стекло на телефон<\/b><br><br><b>1. Подготовьте экран<\/b><br>Очистите его влажной салфеткой, вытрите насухо и удалите пыль клейким стикером.<br><br><b>2. Установите рамку<\/b><br>Положите устройство на ровную поверхность и установите рамку так, как показано в ролике.<br><br><b>3. Наклейте стекло<\/b><br>Потяните за язычок или нажмите на область запуска по инструкции из ролика. Не сдвигайте рамку во время установки.<br><br><b>4. Снимите рамку<\/b><br>Подождите несколько секунд, аккуратно снимите рамку и разгладьте оставшийся воздух от центра к краям.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">📱 Стекло на телефон<br><br>Рассказываем, как идеально выровнять стекло по краям и легко выгнать все пузыри<br><br>🔁 Не получилось с первого раза? Напиши в 💬 Техподдержку, во всём разберёмся!<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 57, "key": "54c4b0970a54", "title": "Стекло на iPad", "anchor": "qa.howto[2] · custom:lesson:tablet_glass", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>🖥 Стекло на iPad<\/b><br><br><b>1. Подготовьте экран<\/b><br>Очистите его влажной салфеткой, вытрите насухо и удалите пыль клейким стикером.<br><br><b>2. Установите рамку<\/b><br>Положите устройство на ровную поверхность и установите рамку так, как показано в ролике.<br><br><b>3. Наклейте стекло<\/b><br>Потяните за язычок или нажмите на область запуска по инструкции из ролика. Не сдвигайте рамку во время установки.<br><br><b>4. Снимите рамку<\/b><br>Подождите несколько секунд, аккуратно снимите рамку и разгладьте оставшийся воздух от центра к краям.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Большой экран: удобнее клеить вдвоём или с фиксацией обычным скотчем.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 58, "key": "0a5162333e84", "title": "Автоустановка на телефон", "anchor": "qa.howto[3] · custom:lesson:auto_install", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>⚙️ Стекло на телефон с автоустановкой<\/b><br><br><b>1. Подготовьте экран<\/b><br>Очистите его влажной салфеткой, вытрите насухо и удалите пыль клейким стикером.<br><br><b>2. Установите рамку<\/b><br>Положите устройство на ровную поверхность и установите рамку так, как показано в ролике.<br><br><b>3. Наклейте стекло<\/b><br>Потяните за язычок или нажмите на область запуска по инструкции из ролика. Не сдвигайте рамку во время установки.<br><br><b>4. Снимите рамку<\/b><br>Подождите несколько секунд, аккуратно снимите рамку и разгладьте оставшийся воздух от центра к краям.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Стекло в рамке-аппликаторе: ставится за один шаг, промахнуться просто невозможно.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 59, "key": "cbadbbca681f", "title": "Автоустановка на iPad", "anchor": "qa.howto[4] · custom:lesson:tablet_auto", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>⚙️ Стекло на iPad с автоустановкой<\/b><br><br><b>1. Подготовьте экран<\/b><br>Очистите его влажной салфеткой, вытрите насухо и удалите пыль клейким стикером.<br><br><b>2. Установите рамку<\/b><br>Положите устройство на ровную поверхность и установите рамку так, как показано в ролике.<br><br><b>3. Наклейте стекло<\/b><br>Потяните за язычок или нажмите на область запуска по инструкции из ролика. Не сдвигайте рамку во время установки.<br><br><b>4. Снимите рамку<\/b><br>Подождите несколько секунд, аккуратно снимите рамку и разгладьте оставшийся воздух от центра к краям.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Тот же удобный аппликатор, только под размер планшета.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 60, "key": "ff3bf7ee6ace", "title": "Стекло на камеру", "anchor": "qa.howto[5] · custom:lesson:camera", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>📷 Стекло на камеру<\/b><br><br><b>1. Очистите камеры<\/b><br>Протрите блок камер влажной и сухой салфетками, затем удалите пылинки клейким стикером.<br><br><b>2. Снимите защитный слой<\/b><br>Держите накладку за края и не касайтесь клеевой стороны.<br><br><b>3. Совместите накладку<\/b><br>Проверьте положение всех отверстий и только после этого опустите накладку на блок камер.<br><br><b>4. Зафиксируйте<\/b><br>Слегка прижмите каждый элемент и проверьте, что края приклеились по всему периметру.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Мелкие стёкла на блок камер: клеим по одному с точным выравниванием.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 61, "key": "b4aec7b2b2a8", "title": "Плёнка на телефон", "anchor": "qa.howto[6] · custom:lesson:phone_film", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>💧 Плёнка на телефон<\/b><br><br><b>1. Подготовьте экран<\/b><br>Очистите экран салфетками и удалите оставшиеся частицы пыли клейким стикером.<br><br><b>2. Примерьте плёнку<\/b><br>Не снимая подложку полностью, совместите плёнку с краями экрана, динамиком и камерой.<br><br><b>3. Наклейте постепенно<\/b><br>Отделяйте подложку небольшими участками и разглаживайте плёнку ракелем от центра к краям.<br><br><b>4. Завершите установку<\/b><br>Снимите верхний транспортировочный слой и ещё раз аккуратно разгладьте поверхность.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Гидрогелевая плёнка клеится совсем не так, как стекло: показываем верную технику.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 62, "key": "126e3bd1434e", "title": "Плёнка на iPad", "anchor": "qa.howto[7] · custom:lesson:tablet_film", "note": "DEV /qa · 1 сообщ. · медиа: answer_video", "scope": "active", "media": ["видео"], "old": "<div class=\"msg\"><div class=\"mtag\">видео<\/div><div class=\"bub\"><b>💧 Плёнка на iPad<\/b><br><br><b>1. Положите планшет на ровную поверхность<\/b><br>Очистите экран влажной и сухой салфетками, затем удалите пыль клейким стикером.<br><br><b>2. Выровняйте плёнку<\/b><br>Примерьте её с защитной подложкой и совместите все вырезы с экраном планшета.<br><br><b>3. Наклеивайте по частям<\/b><br>Зафиксируйте один край, постепенно отделяйте подложку и проводите ракелем от центра к краям.<br><br><b>4. Проверьте результат<\/b><br>Снимите верхний транспортировочный слой и разгладьте оставшийся воздух мягкой салфеткой.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Большой формат: показываем, как правильно наклеить, чтобы плёнка не тянулась и не задиралась по краям.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 63, "key": "b8e42d7a1986", "title": "Урок: видео ещё не загружено", "anchor": "qa.howto[8] · handlers.qa_catalog._lesson_placeholder_text", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\"><b>💧 Плёнка на телефон<\/b><br><br>🎬 Видеоинструкция скоро появится. Пока используйте шаги ниже.<br><br><b>1. Подготовьте экран<\/b><br>Очистите экран салфетками и удалите оставшиеся частицы пыли клейким стикером.<br><br><b>2. Примерьте плёнку<\/b><br>Не снимая подложку полностью, совместите плёнку с краями экрана, динамиком и камерой.<br><br><b>3. Наклейте постепенно<\/b><br>Отделяйте подложку небольшими участками и разглаживайте плёнку ракелем от центра к краям.<br><br><b>4. Завершите установку<\/b><br>Снимите верхний транспортировочный слой и ещё раз аккуратно разгладьте поверхность.<br><br>🔁 Не получилось с первого раза — напишите в 💬 Техподдержку, разберёмся.<br>👇 Другие ролики — кнопка ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">💧 Плёнка на телефон<br><br>🎬 Видеоинструкция скоро появится. Пока используй шаги ниже.<br><br>1. Подготовь экран<br>Очисти экран салфетками и удали оставшиеся частицы пыли клейким стикером.<br><br>2. Примерь плёнку<br>Не снимая подложку полностью, совмести плёнку с краями экрана, динамиком и камерой.<br><br>3. Наклей постепенно<br>Отделяй подложку небольшими участками и разглаживай плёнку ракелем от центра к краям.<br><br>4. Заверши установку<br>Сними верхний транспортировочный слой и ещё раз аккуратно разгладь поверхность.<br><br>🔁 Не получилось с первого раза? Напиши в «Техподдержку», во всём разберёмся!<br><br>👇 Другие ролики можно посмотреть по кнопке ниже.<\/div><div class=\"kbrow\"><span class=\"kb\">◀️ Другие ролики<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}]}, {"title": "Техподдержка", "items": [{"n": 64, "key": "a8767e810dc8", "title": "Вход в поддержку", "anchor": "qa.support[0] · handlers.support._welcome_text", "note": "DEV /qa · 1 сообщ. · медиа: send_sticker", "scope": "active", "media": ["стикер"], "old": "<div class=\"msg\"><div class=\"bub\">💬 <b>Техподдержка<\/b><br><br>Спрашивайте о чём угодно — по товару, гарантии, доставке или чему-то ещё.<br><br>✅ На частые вопросы ответим сразу.<br>👤 Если нужно — подключим оператора.<br><br>✍️ Напишите вопрос обычным сообщением 👇<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Спрашивай о чём угодно: про товары, гарантию, доставку или любые другие вопросы.<br><br>✅ На частые вопросы ответим моментально<br>👤 Если вопрос сложный, сразу подзовём человека<br><br>✍️ Пиши всё прямо сюда 👇<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 65, "key": "f7314e9387ce", "title": "Открытых обращений нет", "anchor": "qa.support[1] · qa.lambda: fmt.screen(\"📋 \" + fmt.title(\"Открытых обращений нет.\"), \"✍️ Напишите вопрос — и обращение появится.\"),", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">📋 <b>Открытых обращений нет.<\/b><br><br>✍️ Напишите вопрос — и обращение появится.<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">✍️ Напиши свой вопрос, и мы сразу откроем новое обращение<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 66, "key": "fd64bee4b124", "title": "Ответ ИИ", "anchor": "qa.support[2] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Расширенная гарантия оформляется после подтверждения покупки. Выберите маркетплейс и следуйте подсказкам бота — после проверки гарантия появится в разделе «Мои покупки».<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><span class=\"kb\">📋 Статус обращения<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Расширенная гарантия оформляется после подтверждения покупки. Выбери маркетплейс и следуй подсказкам бота. После проверки гарантия появится в разделе «Мои покупки»<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><span class=\"kb\">📋 Статус обращения<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 67, "key": "f71061e2c902", "title": "Ответ ИИ и передача оператору", "anchor": "qa.support[3] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">По вашему описанию нужна ручная проверка покупки.<br><br>🤝 <b>Передаём вопрос оператору<\/b> — он напишет в этот же чат.<br>💬 Появятся ещё вопросы — пишите сюда же.<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><span class=\"kb\">📋 Статус обращения<\/span><\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">🤝 Передали вопрос оператору: он ответит прямо в этот чат.<br><br>💬 Появилось что-то ещё? Пиши сразу сюда, всё привяжем к теме<\/div><div class=\"kbrow\"><span class=\"kb\">👤 Написать оператору<\/span><span class=\"kb\">📋 Статус обращения<\/span><\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 68, "key": "915fed74e756", "title": "Передали оператору", "anchor": "qa.support[4] · qa.lambda: fmt.screen( \"✅ \" + fmt.title(\"Передали оператору.\"), fmt.lines(\"👤 Ответит в этом же чате.\", \"🕘 Обычно <b>в течение рабочего дня<\/b>.\"), fmt.note(\"Появятся ещё вопросы — пишите сюда же.\"), ),", "note": "DEV /qa · 1 сообщ. · медиа: send_sticker", "scope": "active", "media": ["стикер"], "old": "<div class=\"msg\"><div class=\"bub\">✅ <b>Передали оператору.<\/b><br><br>👤 Ответит в этом же чате.<br>🕘 Обычно <b>в течение рабочего дня<\/b>.<br><br><i>Появятся ещё вопросы — пишите сюда же.<\/i><\/div><\/div>", "new": "", "note_new": "✅ Передали сообщение оператору!<br>👤 Он ответит прямо в этом чате<br>🕘 Обычно это занимает не больше рабочего дня<br>💬 Появится что-то ещё: просто пиши сюда же!", "hint": "Согласовать реальный SLA ответа оператора перед обещанием «не больше рабочего дня».", "v": "question"}, {"n": 69, "key": "8e05e32886fc", "title": "Оператор получил сообщение", "anchor": "qa.support[5] · qa.lambda: fmt.screen(\"📨 \" + fmt.title(\"Оператор получил ваше сообщение.\"), \"Ответ придёт сюда же, обычно в течение рабочего дня.\"),", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">📨 <b>Оператор получил ваше сообщение.<\/b><br><br>Ответ придёт сюда же, обычно в течение рабочего дня.<\/div><\/div>", "new": "", "note_new": "📨 Оператор получил твоё сообщение!<br>Вернёмся с ответом прямо сюда, обычно это занимает не больше рабочего дня", "hint": "Согласовать реальный SLA ответа оператора перед обещанием «не больше рабочего дня».", "v": "question"}, {"n": 70, "key": "5a4df01b105c", "title": "Дневной лимит", "anchor": "qa.support[6] · qa.Screen(\"Дневной лимит\", lambda: support._limit_reached_text(get_settings().support_daily_limit)),", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">⏳ <b>На сегодня — 20 сообщений.<\/b><br><br>👤 Дальше отвечает оператор — напишет вам в этот же чат.<br><br><i>Завтра счётчик обнулится.<\/i><\/div><\/div>", "new": "", "note_new": "⏳ Лимит на сегодня: 20 сообщений.<br><br>👤 Дальше подключится оператор и ответит прямо в этот чат<br><br>Счётчик полностью обновится завтра!", "hint": "Согласовать реальный SLA ответа оператора перед обещанием срока.", "v": "question"}, {"n": 71, "key": "a32db044d82b", "title": "Заблокированный пользователь", "anchor": "qa.support[7] · handlers.support._banned_support_text", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">💬 <b>Техподдержка<\/b><br><br>🔒 Ваш аккаунт заблокирован, поэтому быстрые ответы недоступны.<br><br>✍️ Напишите свой вопрос — оператор разберётся вручную.<br><br>🕘 Обычно отвечаем <b>в течение рабочего дня<\/b>.<\/div><\/div>", "ne "><div class=\"bub\">⚠️ Не получилось найти ни одной цифры!<br><br>Номер заказа Яндекс Маркета выглядит так: 31415926, он в разделе «Мои заказы».<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 207, "key": "28f323d90679", "title": "Автопроверка не справилась за неделю", "anchor": "qa.system[9] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">⌛ <b>За неделю подтвердить заявку автоматически не получилось.<\/b><br><br>Передали её специалисту — он посмотрит вручную и напишет вам. Повторять шаги не нужно.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">Перекинули заявку человеку: специалист всё проверит вручную и свяжется с тобой. Заново ничего отправлять не надо.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 208, "key": "91fef22817c8", "title": "Пустое сообщение в поддержке", "anchor": "qa.system[10] · qa.Screen(\"Пустое сообщение в поддержке\", lambda: fmt.screen(\"✍️ \" + fmt.title(\"Напишите вопрос обычным текстом.\"), \"Ответим здесь же.\")),", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">✍️ <b>Напишите вопрос обычным текстом.<\/b><br><br>Ответим здесь же.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">✍️ Напиши вопрос обычным текстом<br>Ответим прямо в этом чате!<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 209, "key": "99a95d74ddba", "title": "Файл в поддержке без релея", "anchor": "qa.system[11] · qa.Screen(\"Файл в поддержке без релея\", lambda: fmt.screen(\"📎 \" + fmt.title(\"Файл получили.\"), \"Опишите проблему словами — так оператор быстрее поймёт, что случилось.\")),", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">📎 <b>Файл получили.<\/b><br><br>Опишите проблему словами — так оператор быстрее поймёт, что случилось.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">📎 Файл получили!<br><br>Опиши, пожалуйста, проблему словами: так наш оператор значительно быстрее поймёт, что именно произошло, и сможет помочь.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 210, "key": "e1f3442da043", "title": "Раздача уже недоступна", "anchor": "qa.system[12] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Извините, этот товар уже разобрали. Вот другие активные раздачи:<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ Ой, этот товар уже разобрали!<br><br>Вот другие активные раздачи, которые доступны прямо сейчас:<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 211, "key": "a3bd681e25a6", "title": "Отписка от рекламных сообщений", "anchor": "qa.system[13] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">✅ Готово! Рекламные сообщения больше приходить не будут. Активация гарантии и доставка выигрышей продолжают работать в обычном режиме.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">✅ Готово! Рекламные сообщения больше не придут.<br><br>Активация гарантии и выдача призов работают как обычно<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 212, "key": "f8c0a3114e3d", "title": "Аккаунт заблокирован оператором", "anchor": "qa.system[14] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">🚫 <b>Ваш аккаунт заблокирован в боте.<\/b><br><br><b>Причина:<\/b> <i>Подозрительная активность<\/i><br><br>Если считаете это ошибкой, напишите в «💬 Техподдержку» — оператор разберёт вручную.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">🚫 Твой профиль временно заблокирован!<br><br>Причина: система заметила подозрительную активность<br><br>💬 Если считаешь, что произошла ошибка, напиши в «Техподдержку». Наш оператор всё проверит вручную!<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 213, "key": "cc53d5eff855", "title": "Аккаунт разблокирован оператором", "anchor": "qa.system[15] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">✅ <b>Ваш аккаунт разблокирован.<\/b><br><br>Снова можно пользоваться ботом — присылать отзывы, получать билеты и участвовать в розыгрыше.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">✅ Ура, твой аккаунт разблокирован!<br><br>🎁 Возвращайся к участию: присылай новые отзывы, получай билеты и лови удачу в розыгрыше!<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 214, "key": "f2dc721a1d8b", "title": "Нет активной заявки гарантии", "anchor": "qa.system[16] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Активной заявки нет<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ У тебя пока нет действующих заявок<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 215, "key": "af512796d270", "title": "Нет активной заявки отчёта", "anchor": "qa.system[17] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Активной заявки нет. Загляните в «📊 Мои заявки».<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ У тебя пока нет действующих заявок<br>Загляни в «📊 Мои заявки».<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 216, "key": "1ba43e137fc6", "title": "Нет заявки на выплату", "anchor": "qa.system[18] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Активной заявки на выплату нет<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ У тебя пока нет действующих заявок<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 217, "key": "0c57f09fe471", "title": "Розыгрыш: неизвестный маркетплейс", "anchor": "qa.system[19] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Такого маркетплейса нет в списке.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ Такого маркетплейса нет в списке<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 218, "key": "9b33aaa100a0", "title": "Розыгрыш не найден", "anchor": "qa.system[20] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Розыгрыш не найден.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ Розыгрыш не найден<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 219, "key": "5ca74d36efe2", "title": "Выбор в розыгрыше уже закрыт", "anchor": "qa.system[21] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Выбор уже сделан или розыгрыш закрыт.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ Ой, выбор в этом розыгрыше уже закрыт!<br>Похоже, ты уже сделали выбор или розыгрыш завершился.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 220, "key": "f190c4e67e5a", "title": "Победитель ещё не определён", "anchor": "qa.system[22] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Победитель не определён.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">🎁 Результаты пока не подведены, итоги появятся чуть позже.<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 221, "key": "99146e52ab2a", "title": "Кнопки нажал не победитель", "anchor": "qa.system[23] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Эти кнопки — для победителя розыгрыша.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">⚠️ Ой, эти кнопки только для победителя!<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 223, "key": "7941b26a8e3a", "title": "Подтверждение выбора в розыгрыше", "anchor": "qa.system[25] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">Выбрано: Ozon<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">✅ Твой выбор принят!<br>Выбрано: Ozon<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}, {"n": 224, "key": "3efe9e33f007", "title": "Передача оператору без Telegram-темы", "anchor": "qa.system[26] · qa.literal", "note": "DEV /qa · 1 сообщ.", "scope": "active", "media": [], "old": "<div class=\"msg\"><div class=\"bub\">📨 Передали оператору. Он ответит в этот же чат, обычно в течение рабочего дня.<\/div><\/div>", "new": "<div class=\"msg\"><div class=\"bub\">🤝 Передаём вопрос оператору! Он ответит прямо в этом чате<\/div><\/div>", "note_new": "", "hint": "", "v": "new"}]}]}</script>
<script>
(function(){
  const d = JSON.parse(document.getElementById('data').textContent);
  const $ = s => document.querySelector(s);
  const NAMES = {new:'Новый текст', question:'Вопрос', keep:'Оставить', stale:'Устарело', none:'Не разобрано'};
  const c = d.meta.counts;
  $('#sub').textContent = `${d.meta.total} экранов бота · собрано из кода ${d.meta.built} · слева сейчас, справа предложение Юли`;
  $('#ptext').textContent = `${d.meta.done} из ${d.meta.total}`;
  ['new','question','keep'].forEach(k => { $('#b-'+k).style.width = (100*c[k]/d.meta.total)+'%'; });
  $('#c-all').textContent = d.meta.total; ['new','question','none'].forEach(k => $('#c-'+k).textContent = c[k]);

  const main = $('#main'), nav = $('#nav');
  d.sections.forEach((sec, si) => {
    const id = 's'+si;
    const el = document.createElement('section');
    el.id = id;
    const done = sec.items.filter(i => i.v !== 'none').length;
    el.innerHTML = `<h2>${sec.title} <small>${done} из ${sec.items.length} разобрано</small></h2>`;
    sec.items.forEach(it => {
      const card = document.createElement('article');
      card.className = 'card'; card.dataset.v = it.v;
      card.dataset.txt = (it.title + ' ' + it.anchor + ' ' + it.old + ' ' + it.new + ' ' + it.note_new).toLowerCase();
      const media = it.media.map(m => `<span class="mt">${m}</span>`).join('');
      let right;
      if (it.new) right = `<div class="pane next">${it.new}</div>`;
      else if (it.note_new) right = `<div class="pane q"><div class="qnote">${it.note_new}</div></div>`;
      else right = `<div class="pane"><div class="empty">Юля до этого экрана не дошла</div></div>`;
      card.innerHTML =
        `<div class="chead"><span class="num">№${it.n}</span><span class="ttl">${it.title}</span>` +
        `<span class="tag t-${it.v}">${NAMES[it.v]}</span>${media}</div>` +
        `<div class="cols">` +
          `<div class="col now"><h3>Сейчас в боте</h3><div class="pane">${it.old}</div></div>` +
          `<div class="col next"><h3>Предложение Юли</h3>${right}</div>` +
        `</div>` +
        (it.hint ? `<div class="hint">${it.hint}</div>` : '') +
        `<div class="anch">${it.anchor}</div>`;
      el.appendChild(card);
    });
    main.appendChild(el);
    const a = document.createElement('a');
    a.href = '#'+id; a.innerHTML = `<span>${sec.title}</span><small>${done}/${sec.items.length}</small>`;
    nav.appendChild(a);
  });

  let filter = 'all', query = '';
  function apply(){
    document.querySelectorAll('.card').forEach(card => {
      let ok = filter === 'all' || card.dataset.v === filter;
      if (ok && query) ok = card.dataset.txt.includes(query);
      card.classList.toggle('hide', !ok);
    });
    document.querySelectorAll('section').forEach(s => {
      s.style.display = s.querySelectorAll('.card:not(.hide)').length ? '' : 'none';
    });
  }
  document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); filter = b.dataset.f; apply();
  }));
  $('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); apply(); });
})();
</script>
