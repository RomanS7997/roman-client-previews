main{min-width:0}

.screen-title{font-size:16px;font-weight:700;margin-bottom:7px}

    (giveawayIndex >= 0 ? `<a href="#sec${giveawayIndex}">Открыть раздачи →</a>` : '');
  const giveawayChip = document.querySelector('[data-f="closed"]');
  if (giveawayChip) giveawayChip.textContent = `Раздачи (${giveawayCount})`;
  (data.meeting_steps || []).forEach(t => {
    const li = document.createElement('li'); li.textContent = t; $('#meetingSteps').appendChild(li);
  });
  (data.meeting_rules || []).forEach(t => {
    const li = document.createElement('li'); li.textContent = t; $('#meetingRules').appendChild(li);
  });

  function esc(t){ return String(t || '').replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;'); }
  function renderText(t){
    // тексты — наши, из кода бота; разрешаем только телеграмовские теги
    let s = esc(t).replace(/<(?!\/?(b|i|u|s|code|pre|blockquote|a|tg-spoiler)(\s[^>]*)?>)/g, '&lt;');
    s = s.replace(/<a\s+href="([^"]*)">/g, '<a href="$1" target="_blank" rel="noopener">');
    return s.replace(/\\n/g, '\n');
  }

  const main = $('#main'), nav = $('#mapSections');
  data.sections.forEach((sec, si) => {
    const id = 'sec' + si;
    const block = document.createElement('section');
    block.className = 'block'; block.id = id;
    block.innerHTML = `<h2><span>${sec.title}</span> <small data-count="${id}"></small><a class="to-sections" href="#mapSections">Все разделы ↑</a></h2><p class="intro">${sec.intro || ''}</p><div class="cards"></div>`;
    const cards = block.querySelector('.cards');
    sec.items.forEach(it => {
      const c = document.createElement('article');
      c.className = 'card'; c.dataset.key = it.key; c.dataset.state = it.state;
      c.dataset.scope = it.scope || 'active'; c.dataset.review = it.review_status || 'todo';
      c.dataset.text = ((it.title || '') + ' ' + it.text + ' ' + it.note + ' ' + it.anchor + ' ' +
        (it.julia_note || '') + ' ' + (it.buttons || []).join(' ')).toLowerCase();
      const tags = [];
      if (it.state === 'new') tags.push('<span class="tag new">новое</span>');
      if (it.state === 'changed') tags.push('<span class="tag changed">исправлено</span>');
      it.reg.forEach(r => tags.push(`<span class="tag reg">${r}</span>`));
      if (it.scope === 'closed') tags.push('<span class="scope closed">закрытая воронка</span>');
      if (it.scope === 'removed') tags.push('<span class="scope removed">удалено из прода</span>');
      const messages = (it.messages || []).filter(m => m.text);
      const bubbles = (messages.length ? messages : [{text: it.text}]).map((message, index) =>
        (messages.length > 1 ? `<div class="message-label">Сообщение ${index + 1}</div>` : '') +
        `<div class="bubble">${renderText(message.text)}</div>`
      ).join('');
      const mediaNames = {
        send_sticker: 'стикер', answer_sticker: 'стикер',
        send_photo: 'фото', answer_photo: 'фото',
        send_video: 'видео', answer_video: 'видео',
        send_animation: 'анимация', answer_animation: 'анимация',
        send_document: 'документ', answer_document: 'документ'
      };
      const mediaTags = (it.media || []).map(method =>
        `<span class="media-tag">${mediaNames[method] || esc(method)}</span>`
      ).join('');
      const screenButtons = (it.buttons || []).map(button =>
        `<span class="btn">${esc(button)}</span>`
      ).join('');
      c.innerHTML = `<div class="meta"><span class="n">№${it.n}</span>${tags.join('')}</div>` +
        (it.title ? `<div class="screen-title">${esc(it.title)}</div>` : '') +
        (it.note ? `<div class="note hint">${esc(it.note)}</div>` : '') +
        (mediaTags ? `<div class="media-tags">${mediaTags}</div>` : '') +
        bubbles +
        (screenButtons ? `<div class="screen-buttons">${screenButtons}</div>` : '') +
        (it.julia_note ? `<div class="source-note"><b>Комментарий Юлии</b>${esc(it.julia_note)}</div>` : '') +
        (it.decision_hint ? `<div class="decision-note"><b>Что решить на созвоне</b>${esc(it.decision_hint)}</div>` : '') +
        `<div class="anchor">${esc(it.anchor)}</div>` +
        `<div class="status-row"><select class="status" aria-label="Статус решения">` +
          `<option value="todo">На проверку</option><option value="accept">Принять</option>` +
          `<option value="rewrite">Переписать</option><option value="decision">Нужно решение</option>` +
          `<option value="stale">Устарело</option></select>` +
          `<textarea class="remark" rows="2" placeholder="Финальный текст или решение"></textarea></div>` +
        `<div class="check"><label><input type="checkbox"> Проверено</label><span class="by"></span></div>`;
      cards.appendChild(c);
    });
    main.appendChild(block);
    const a = document.createElement('a');
    a.href = '#' + id; a.innerHTML = `<span>${sec.title.replace(/ *\(.*\)/, '')}</span><small data-nav="${id}"></small>`;
    nav.appendChild(a);
  });
  if (data.buttons && data.buttons.length){
    const block = document.createElement('section');
    block.className = 'block'; block.id = 'buttons';
    block.innerHTML = `<h2>Надписи на кнопках</h2><p class="intro">Дословно из кода. Название раздела в тексте обязано совпадать с надписью на кнопке.</p>`;
    data.buttons.forEach(([name, items]) => {
      const d = document.createElement('div');
      d.style.marginBottom = '12px';
      d.innerHTML = `<div class="note" style="margin-bottom:6px">${esc(name)}</div><div class="btns">${items.map(b => `<span class="btn">${esc(b)}</span>`).join('')}</div>`;
      block.appendChild(d);
    });
    main.appendChild(block);
    const a = document.createElement('a'); a.href = '#buttons'; a.innerHTML = '<span>Кнопки</span>'; nav.appendChild(a);
  }

  function applyFilter(){
    const q = state.q;
    document.querySelectorAll('.card').forEach(c => {
      const ch = state.checks[c.dataset.key] || {};
      const review = ch.status || c.dataset.review || 'todo';
      let show = true;
      if (state.filter === 'active') show = c.dataset.scope === 'active';
      else if (state.filter === 'changed') show = c.dataset.state !== 'same';
      else if (state.filter === 'todo') show = !ch.ok;
      else if (state.filter === 'decision') show = review === 'decision';
      else if (state.filter === 'rewrite') show = review === 'rewrite';
      else if (state.filter === 'closed') show = c.dataset.scope === 'closed';
      else if (state.filter === 'remarks') show = !!((ch.note && ch.note.trim()) || (itemByKey[c.dataset.key] || {}).julia_note);
      if (show && q) show = c.dataset.text.includes(q);
      c.classList.toggle('hidden', !show);
    });
    data.sections.forEach((sec, si) => {
      const id = 'sec' + si;
      const block = document.getElementById(id);
      const visible = !!block.querySelector('.card:not(.hidden)');
      block.hidden = !visible;
      const link = nav.querySelector(`a[href="#${id}"]`);
      if (link) link.hidden = !visible;
    });
  }
  function paintChecks(){
    let done = 0;
    document.querySelectorAll('.card').forEach(c => {
      const ch = state.checks[c.dataset.key] || {};
      const it = itemByKey[c.dataset.key] || {};
      const box = c.querySelector('input[type=checkbox]');
      box.checked = !!ch.ok; c.classList.toggle('ok', !!ch.ok);
      if (ch.ok) done++;
      c.querySelector('.by').textContent = ch.ok ? `${ch.by || ''} · ${ch.at || ''}` : '';
      const r = c.querySelector('.remark');
      if (document.activeElement !== r) r.value = ch.note || '';
      const s = c.querySelector('.status');
      if (document.activeElement !== s) s.value = ch.status || it.review_status || 'todo';
      c.dataset.review = s.value;
    });
    $('#ptext').textContent = `${done} из ${renderedTotal}`;
    $('#pbar').style.width = (100 * done / Math.max(1, renderedTotal)) + '%';
    data.sections.forEach((sec, si) => {
      const id = 'sec' + si;
      const n = sec.items.filter(it => (state.checks[it.key] || {}).ok).length;
      const t = `${n}/${sec.items.length}`;
      const el = document.querySelector(`[data-count="${id}"]`); if (el) el.textContent = 'проверено ' + t;
      const nv = document.querySelector(`[data-nav="${id}"]`); if (nv) { nv.textContent = t; nv.parentElement.classList.toggle('done', n === sec.items.length); }
    });
    applyFilter();
  }
  document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); state.filter = b.dataset.f; applyFilter();
  }));
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); applyFilter(); });

  function stamp(){ const d = new Date(); return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
  function needName(){
    let n = who.value.trim();
    if (!n) { n = (prompt('Как вас подписать в галочках?') || '').trim(); if (n) { who.value = n; try { localStorage.setItem('acc_name', n); } catch(e){} } }
    return n;
  }
  const LS_KEY = 'acc_checks_v2_20260914';
  function saveLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state.checks)); } catch(e){ console.warn('localStorage', e); }
  }
  async function save(key, patch){
    const cur = Object.assign({}, state.checks[key] || {}, patch);
    state.checks[key] = cur; paintChecks();
    if (!state.db) { saveLocal(); return; }
    try { await state.db.doc('checks/' + key).set(cur); }
    catch(e){ console.warn('db set', e); }
  }

  // Отчёт текстом: на странице без общей базы это единственный способ
  // вернуть замечания — скопировал и отправил в чат.
  $('#report').addEventListener('click', async () => {
    const lines = [], remarks = [], todo = [];
    let done = 0;
    allItems.forEach(it => {
      const ch = state.checks[it.key] || {};
      if (ch.ok) done++;
      const status = ch.status || it.review_status || 'todo';
      if (status !== 'accept' || ch.note || it.julia_note) {
        remarks.push(`№${it.n} [${status}] (${it.anchor})` +
          (it.julia_note ? `\nКомментарий Юлии: ${it.julia_note}` : '') +
          (ch.note ? `\nИтог: ${ch.note}` : ''));
      }
      if (!ch.ok && it.state !== 'same') todo.push(`№${it.n} ${it.anchor}`);
    });
    lines.push(`Приёмочная карта GiftsActivate, версия кода ${data.built}`);
    lines.push(`Смотрел(а): ${who.value.trim() || 'без имени'} · ${stamp()}`);
    lines.push(`Проверено ${done} из ${renderedTotal}`);
    if (remarks.length) lines.push('', 'Замечания:', ...remarks);
    if (todo.length) lines.push('', `Изменённые экраны без галочки (${todo.length}):`, ...todo.slice(0, 40));
    const text = lines.join('\n');
    const btn = $('#report');
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Скопировано'; }
    catch(e){ window.prompt('Скопируйте отчёт:', text); btn.textContent = 'Скопировать отчёт'; }
    setTimeout(() => { btn.textContent = 'Скопировать отчёт'; }, 2000);
  });
  main.addEventListener('change', e => {
    const c = e.target.closest('.card'); if (!c) return;
    if (e.target.type === 'checkbox'){
      const on = e.target.checked;
      const name = on ? needName() : '';
      if (on && !name) { e.target.checked = false; return; }
      save(c.dataset.key, on ? {ok: true, by: name, at: stamp()} : {ok: false, by: '', at: ''});
    } else if (e.target.classList.contains('remark')){
      save(c.dataset.key, {note: e.target.value.trim(), noteBy: who.value.trim(), noteAt: stamp()});
    } else if (e.target.classList.contains('status')){
      save(c.dataset.key, {status: e.target.value, statusBy: who.value.trim(), statusAt: stamp()});
    }
  });
  paintChecks();

  const initialHash = location.hash.slice(1);
  const initialTarget = initialHash && document.getElementById(initialHash);
  if (initialTarget && giveawayIndex >= 0 && initialHash !== `sec${giveawayIndex}`) {
    const notice = document.createElement('div');
    notice.className = 'deep-note';
    notice.innerHTML = `Вы открыли один раздел полной карты. <a href="#sec${giveawayIndex}">Раздачи и отчёт — ${giveawayCount} экранов</a>.`;
    initialTarget.prepend(notice);
  }
  if (initialTarget) requestAnimationFrame(() => initialTarget.scrollIntoView({block: 'start'}));

  function goLocal(){
    // Общей базы нет (страница вне claude.ai): галочки живут в этом браузере,
    // вернуть их можно кнопкой «Скопировать отчёт».
    state.db = null;
    const defaults = {};
    allItems.forEach(it => { defaults[it.key] = {status: it.review_status || 'todo'}; });
    try { state.checks = Object.assign(defaults, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); }
    catch(e){ state.checks = defaults; }
    const el = $('#offline');
    el.textContent = 'Галочки и замечания сохраняются только в этом браузере — у каждого свои. Закончите — нажмите «Скопировать отчёт» и пришлите текст в чат.';
    el.hidden = false;
    paintChecks();
  }
  (async () => {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
    if (!db) { goLocal(); return; }
    state.db = db;
    db.collection('checks').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      state.checks = next; paintChecks();
    }, err => { console.warn('db', err); goLocal(); });
  })();
})();
</script>

</body>
</html>
