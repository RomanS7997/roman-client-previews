<style>
:root{
  --bg:#F5EFE4; --bg2:#EDE4D3; --card:#FFFDF8; --bubble:#FFFFFF; --ink:#2A1F1B; --muted:#7B6C63;
  --line:#DDD2C0; --accent:#6B1D2A; --accent-ink:#FFFFFF; --gold:#C9A24A; --mint:#CFE8DD; --mint-ink:#1F5B44;
  --amber:#F7E2B0; --amber-ink:#6A4A00; --rose:#F3D5D8; --rose-ink:#7A1F2B; --blue:#D9E6F5; --blue-ink:#22456E;
  --shadow:0 1px 2px rgba(42,31,27,.06), 0 8px 24px rgba(42,31,27,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1815; --bg2:#26201C; --card:#2B2420; --bubble:#332B26; --ink:#F1E8DB; --muted:#B4A497;
    --line:#443A33; --accent:#D98A96; --accent-ink:#2A1F1B; --gold:#D8B569; --mint:#274A3C; --mint-ink:#CFE8DD;
    --amber:#5A4410; --amber-ink:#F7E2B0; --rose:#5B2630; --rose-ink:#F3D5D8; --blue:#233A57; --blue-ink:#D9E6F5;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1815; --bg2:#26201C; --card:#2B2420; --bubble:#332B26; --ink:#F1E8DB; --muted:#B4A497;
  --line:#443A33; --accent:#D98A96; --accent-ink:#2A1F1B; --gold:#D8B569; --mint:#274A3C; --mint-ink:#CFE8DD;
  --amber:#5A4410; --amber-ink:#F7E2B0; --rose:#5B2630; --rose-ink:#F3D5D8; --blue:#233A57; --blue-ink:#D9E6F5;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding:8px 0 14px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.progress{min-width:220px;flex:1;max-width:420px}
.progress .bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .3s}
.progress .lbl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.progress .lbl b{color:var(--ink);font-variant-numeric:tabular-nums}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:150px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:500 13px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools input[type=search]{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);min-width:180px;flex:1;max-width:320px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:24px;margin-top:16px}
nav.sec{position:sticky;top:60px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav.sec a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:10px;font-size:14px}
nav.sec a:hover{background:var(--bg2)}
nav.sec a small{color:var(--muted);font-variant-numeric:tabular-nums}
nav.sec a.done small{color:var(--mint-ink)}
main{min-width:0}
section.block{margin-bottom:28px}
section.block>h2{font-size:17px;margin:8px 0 2px;display:flex;align-items:baseline;gap:10px}
section.block>h2 small{font:500 12px Inter,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
section.block>p.intro{margin:0 0 12px;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card.hidden{display:none}
.card.ok{border-color:var(--mint-ink);outline:2px solid var(--mint);outline-offset:-2px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.card .meta .n{font:500 12px "JetBrains Mono",monospace;color:var(--ink)}
.tag{border-radius:6px;padding:2px 7px;font:600 11px Inter,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.tag.new{background:var(--rose);color:var(--rose-ink)}
.tag.changed{background:var(--amber);color:var(--amber-ink)}
.tag.reg{background:var(--blue);color:var(--blue-ink);text-transform:none;font-family:"JetBrains Mono",monospace;font-weight:500}
.bubble{background:var(--bubble);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.bubble blockquote{margin:6px 0;padding:2px 10px;border-left:3px solid var(--accent);color:var(--muted);white-space:pre-wrap}
.bubble code{font:13px "JetBrains Mono",monospace;background:var(--bg2);padding:0 4px;border-radius:4px}
.bubble a{text-decoration:underline}
.note{font-size:12px;color:var(--muted)}
.note.hint{font-style:italic}
.anchor{font:11px "JetBrains Mono",monospace;color:var(--muted);overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}
.check label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.check .by{color:var(--mint-ink);font-size:12px;margin-left:auto;text-align:right}
.remark{width:100%;font:13px Inter,sans-serif;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical;min-height:30px}
.remark:placeholder-shown{min-height:30px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--bubble);border-radius:8px;padding:6px 10px;font-size:13px}
.offline{background:var(--amber);color:var(--amber-ink);padding:8px 12px;border-radius:10px;font-size:13px;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.sec{position:static;flex-direction:row;flex-wrap:wrap}nav.sec a{padding:6px 10px;background:var(--card);border:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.progress .bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <h1>Приёмочная карта GiftsActivate</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="progress"><div class="lbl"><span>Проверено</span><b id="ptext">0 из 0</b></div><div class="bar"><i id="pbar"></i></div></div>

<div class="legend"><span><span class="tag new">новое</span> экрана не было на показе 03.09</span><span><span class="tag changed">исправлено</span> текст изменился после показа</span><span><span class="tag reg">E14</span> строка реестра правок</span></div>

</div>
<div class="layout">
  <nav class="sec" id="nav"></nav>
  <main id="main"></main>
</div>
