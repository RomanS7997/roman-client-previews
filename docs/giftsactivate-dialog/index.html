<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GiftsActivate · Просмотр диалогов</title>
  <link rel="stylesheet" href="style.css?v=20260930-simple">
  <script defer src="assets/lucide.min.js"></script>
  <script defer src="data.js?v=20260930-lessons-clean"></script><script defer src="emoji-data.js?v=20260930"></script><script defer src="app.js?v=20260930-lessons-clean"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/avatar.jpg" alt=""><div><strong>GiftsActivate</strong><span>Приёмка диалогов</span></div><span class="dev-label">DEV</span></div>
    <div class="top-actions"><span id="save-state" role="status">На этом устройстве</span><button id="import" class="icon-button" title="Импортировать отметки" aria-label="Импортировать отметки"><i data-lucide="upload"></i></button><button id="export" class="button"><i data-lucide="download"></i><span>Экспорт правок</span></button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="Сценарии">
      <div class="side-title">ВСЕ СЦЕНАРИИ <span id="total-count"></span></div>
      <h1>Диалоги бота</h1>
      <div class="coverage"><span><b id="viewed-count">0</b> из <span id="review-total"></span> просмотрено</span><span id="percent">0%</span></div><progress id="progress" value="0" aria-label="Просмотрено экранов"></progress>
      <label class="search-field"><i data-lucide="search"></i><input id="search" type="search" placeholder="Экран, текст, № в карте" aria-label="Поиск экрана"></label>
      <select id="review-filter" aria-label="Фильтр экранов"><option value="all">Все экраны</option><option value="unviewed">Не просмотрены</option><option value="viewed">Просмотрены</option></select>
      <div id="category-nav"></div><p id="empty-search" hidden>Ничего не найдено</p>
      <div class="side-bottom"><i data-lucide="git-branch"></i><div><strong>Снимок DEV</strong><span id="snapshot"></span></div></div>
    </aside>
    <main class="preview">
      <div class="preview-toolbar"><div class="segmented" aria-label="Режим просмотра"><button data-mode="screen" class="active" aria-pressed="true"><i data-lucide="smartphone"></i>Экран</button><button data-mode="dialog" aria-pressed="false"><i data-lucide="messages-square"></i>Переписка</button></div><div class="preview-tools"><button class="icon-button" id="animation" title="Приостановить анимацию" aria-label="Приостановить анимацию" aria-pressed="false"><i data-lucide="pause"></i></button><button class="icon-button" id="theme" title="Светлая тема Telegram" aria-label="Светлая тема Telegram"><i data-lucide="sun"></i></button><button class="icon-button" id="focus" title="Режим показа" aria-label="Режим показа"><i data-lucide="maximize-2"></i></button></div></div>
      <div class="edition-toolbar"><div class="segmented" aria-label="Редакция текста"><button data-edition="julia" class="active" aria-pressed="true">Редакция Юлии</button><button data-edition="current" aria-pressed="false">Снимок DEV</button></div><span id="edition-state"></span></div>
      <section class="phone" aria-label="Telegram на телефоне">
        <div class="phone-status"><strong>9:41</strong><div><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></div></div>
        <div class="telegram-header"><i data-lucide="chevron-left" class="back-icon"></i><img src="assets/avatar.jpg" alt="Аватар бота"><div><strong>Хранилище плюшек 🥨</strong><span>бот</span></div><i data-lucide="ellipsis-vertical"></i></div>
        <div class="chat-scroll" id="chat" tabindex="0" aria-label="Сообщения бота"></div>
        <div class="composer"><i data-lucide="paperclip"></i><span>Сообщение</span><i data-lucide="smile"></i><i data-lucide="mic"></i></div>
        <div id="reply-keyboard" class="reply-keyboard"></div><div class="home-indicator"><span></span></div>
      </section>
      <div class="step-controls"><button id="previous" class="icon-button" title="Предыдущий экран" aria-label="Предыдущий экран"><i data-lucide="arrow-left"></i></button><div><span id="current-title"></span><small id="current-position"></small></div><button id="next" class="next-button">Дальше<i data-lucide="arrow-right"></i></button></div>
    </main>
  </div>
  <div id="toast" role="status"></div>
  <dialog id="photo-viewer" aria-label="Просмотр изображения"><form method="dialog"><button class="icon-button" title="Закрыть изображение" aria-label="Закрыть изображение"><i data-lucide="x"></i></button></form><img id="photo-viewer-image" alt=""></dialog>
  <dialog id="boundary"><button class="icon-button close-dialog" aria-label="Закрыть" title="Закрыть"><i data-lucide="x"></i></button><i data-lucide="layers-2" class="dialog-icon"></i><h2 id="boundary-title"></h2><p id="boundary-description"></p><div id="boundary-options"></div><button class="button close-dialog">Закрыть</button></dialog>
</body>
</html>
